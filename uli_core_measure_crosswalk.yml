###########################################################
## Mexicali ULI: crosswalk from GHSCI outputs to core measures.
##
## The workbook ("ULI_Tables by domain - simplified_August") is organised as 25
## core measures, each fed by sub-variables with an owner.  GHSCI produces its
## own variables, named by its own conventions.  This file states which GHSCI
## variables answer which sub-variable, and -- as importantly -- how well.
##
## 'relation' is a fixed vocabulary, so partial coverage is stated rather than
## implied:
##
##   direct         GHSCI measures the sub-variable as specified
##   proxy          measures something related, but not the same quantity; the
##                  difference must be carried into how the result is labelled
##   component      supplies an input to the sub-variable, not the whole of it
##   complementary  measures the same construct by a different method, which
##                  will not reproduce the specified method's numbers
##   not_covered    not ours; listed so the gap is visible
##
## Values are delivered in natural units with a declared direction.  Nothing is
## normalised or weighted here: per the decisions record (DECISIONS.md section
## 7) that happens once, centrally, at the index step.
##
## Variables are named without their scale prefix where GHSCI produces a family
## of them.  'pop_' prefixed variants are the population-weighted city values of
## the same measure and are not listed separately.
##
## build_uli_crosswalk.py joins this against the region's generated data
## dictionary, so units, statistic and plain-language descriptions come from
## GHSCI rather than being retyped here, and reports both directions of
## mismatch: variables claimed but not produced, and variables produced but not
## claimed.
# yamllint disable rule:line-length
###########################################################
---
region: MX_Mexicali_2025_ULI
workbook: ULI_Tables by domain - simplified_August - 2026-08-19.xlsx
work_package: WP01_ghsci_access_network
scales: [grid_100m, manzanas, agebs, condesa_lotes, condesa_fraccionamientos, region]

core_measures:
  2:
    core_measure: Global Urban Heat Vulnerability Index (GUHVI)
    domains: [Ambient environment]
    owner: Carl
    notes: >
      The workbook's three sub-variables are this measure's own components, so
      the mapping is one to one rather than approximate.  Requires the Earth
      Engine container; skipped with a message elsewhere.
    sub_variables:
      - id: '382'
        name: Heat exposure
        relation: direct
        direction: lower_is_better
        variables: [urban_heat_exposure_index, urban_heat_land_surface_temp_c]
      - name: Heat sensitivity
        relation: direct
        direction: lower_is_better
        variables:
          - urban_heat_sensitivity_index
          - urban_heat_land_surface_albedo
          - urban_heat_ndvi
          - urban_heat_local_climate_zone_ordered
          - urban_heat_population_density_per_sqkm
          - urban_heat_vulnerable_pop_pct
      - name: Adaptive capability
        relation: direct
        direction: higher_is_better
        variables:
          - urban_heat_adaptive_capability_index
          - urban_heat_child_dependency_ratio
          - urban_heat_subnational_hdi
          - urban_heat_infant_mortality_rate
      - name: Overall vulnerability
        relation: direct
        direction: lower_is_better
        variables:
          - urban_heat_guhvi
          - urban_heat_guhvi_class
          - pct_urban_heat_guhvi_class_5_most_vulnerable

  5:
    core_measure: Large Public Open Spaces Accessibility
    domains: [Ambient environment, Built environment]
    owner: Juan
    sub_variables:
      - id: '91, 187'
        name: Percentage of population with access to LPUGS within 500 m
        relation: direct
        direction: higher_is_better
        variables:
          - pct_access_500m_large_public_green_space_score
          - pop_pct_access_500m_large_public_green_space_score
      - id: '91, 187'
        name: Percentage of total land area within 500 m of LPUGS
        relation: complementary
        direction: higher_is_better
        notes: >
          GHSCI reports the share of the population, and of sample points, not
          of land area.  In Condesa, which is platted but largely unoccupied,
          those differ substantially and the distinction matters: a land area
          share would count the empty lots, a population share effectively will
          not.
        variables: [pct_access_500m_large_public_green_space_score]

  6:
    core_measure: Large Public Open Spaces Availability
    domains: [Ambient environment, Built environment]
    owner: Juan
    sub_variables:
      - id: '91, 187'
        name: Percentage of total land area that is LPUGS
        relation: component
        direction: higher_is_better
        notes: >
          The Earth Engine step produces the large_public_urban_green_space
          polygon layer, but no land area share is written as an indicator
          column.  The input is supplied; the share is a straightforward
          derivation from it, and is not currently delivered.
        variables: []
      - id: '91, 187'
        name: Percentage of total land area with annual average NDVI >= 0.2
        relation: component
        direction: higher_is_better
        notes: >
          As above: the lpugs_overall_greenery raster (NDVI >= 0.2) is produced,
          the area share is not.  urban_heat_ndvi gives mean NDVI per cell,
          which is a different quantity from the share of land above a
          threshold.
        variables: [urban_heat_ndvi]

  7:
    core_measure: Access to parks
    domains: [Ambient environment, Built environment]
    owner: Juan
    sub_variables:
      - id: '162'
        name: Access to parks (local, neighbourhood, district, regional)
        relation: proxy
        direction: higher_is_better
        notes: >
          GHSCI distinguishes open space by area, not by the park hierarchy the
          sub-variable names; a local / neighbourhood / district / regional
          classification would have to come from a municipal inventory.
        variables:
          - avg_walk_dist_public_open_space_any
          - avg_walk_dist_public_open_space_large
      - id: '162'
        name: Population with access to parks
        relation: direct
        direction: higher_is_better
        variables:
          - pct_access_500m_public_open_space_any_score
          - pct_access_500m_public_open_space_large_score
          - pct_access_walk_public_open_space_any_300m
          - pct_access_walk_public_open_space_large_300m

  8:
    core_measure: Available natural blue spaces
    domains: [Ambient environment]
    owner: Rodolfo
    sub_variables:
      - id: '10'
        name: Available natural blue spaces
        relation: complementary
        direction: higher_is_better
        notes: >
          The workbook specifies an MNDWI-derived score banded by Euclidean
          distance from water (< 200 m, 200-500 m, 500-1000 m, 1000-1500 m).
          What is delivered here is network distance to reachable water, which
          is an accessibility measure rather than an availability one and will
          not reproduce those bands.  Reported alongside, not instead of.
          'blue_space' covers rivers, canals, drains, lakes, wetlands, beaches
          and coast, including canals mapped as ways, which is most of
          Mexicali's blue space; 'public_open_space_with_water' is the narrower
          question of a park that contains water.
        variables:
          - pct_access_walk_blue_space_300m
          - avg_walk_dist_blue_space
          - pct_access_walk_public_open_space_with_water_300m
          - avg_walk_dist_public_open_space_with_water

  13:
    core_measure: Pedestrian infrastructure presence
    domains: [Built environment, Mobility & Transport, Safety]
    owner: Juan
    sub_variables:
      - id: '362, 74'
        name: Street connectivity
        relation: direct
        direction: higher_is_better
        variables: [local_nh_intersection_density]
      - name: Block size
        relation: not_covered
        direction: lower_is_better
      - id: '75'
        name: Sidewalk coverage
        relation: not_covered
        direction: higher_is_better
        notes: OpenStreetMap sidewalk tagging in Mexicali is too sparse to support this.

  14:
    core_measure: Public-transport access
    domains: [Mobility & Transport]
    owner: Carl
    sub_variables:
      - id: '26'
        name: Access to public transport stops
        relation: proxy
        direction: higher_is_better
        notes: >
          Mexicali has no GTFS feed, so service frequency cannot be measured and
          the frequent-stop indicator is not produced.  Per the workbook's own
          implementation note this is transit-stop proximity, not transit
          access, and must be labelled as such.  Stops come from the IMIP
          equipamiento layer pooled with OpenStreetMap.
        variables:
          - pct_access_walk_pt_any_300m
          - avg_walk_dist_pt_any
      - id: '223'
        name: Access to co-location of recreational areas with public transport
        relation: not_covered
        direction: higher_is_better
        notes: >
          The activity centre machinery answers exactly this shape of question
          -- a location whose own walkable catchment reaches every required
          category -- but none of the five definitions configured for Mexicali
          pairs recreation with public transport.  Adding one is a single
          configuration entry; it has not been agreed, so it is not claimed.
          The nearest existing measures are the civic centre (community,
          culture, sport) and the jobs centre, which does include public
          transport.
        variables: []

  15:
    core_measure: Daily essential-services access
    domains: [Social infrastructure, Mobility & Transport, Economic development]
    owner: Carl
    sub_variables:
      - id: '129, 11, 367'
        name: Access to fresh food
        relation: direct
        direction: higher_is_better
        variables:
          - pct_access_walk_denue_fresh_food_300m
          - avg_walk_dist_denue_fresh_food
      - id: '129, 11, 367'
        name: Percentage of population with access to fresh food
        relation: direct
        direction: higher_is_better
        variables: [pop_pct_access_walk_denue_fresh_food_300m]
      - id: '129, 11, 367'
        name: Diversity of available fresh food
        relation: direct
        direction: higher_is_better
        notes: >
          Normalised Shannon entropy over seven sub-types: meat, produce, grains
          and spices, dairy, supermarket, minisuper, and bakeries and
          tortillerias.  The last is a category added for this: SCIAN classifies
          panificacion and tortillerias as manufacturing, so they sat outside
          every 46xx food code and were invisible to the food indicators,
          although the workbook names them as fresh food.
        variables:
          - avg_diversity_walk_fresh_food_300m
          - avg_diversity_walk_fresh_food_1000m
          - avg_richness_walk_fresh_food_300m
          - avg_count_walk_fresh_food__meat_300m
          - avg_count_walk_fresh_food__produce_300m
          - avg_count_walk_fresh_food__grains_and_spices_300m
          - avg_count_walk_fresh_food__dairy_300m
          - avg_count_walk_fresh_food__supermarket_300m
          - avg_count_walk_fresh_food__minisuper_300m
          - avg_count_walk_fresh_food__bakery_tortilleria_300m
      - id: '132'
        name: Access to convenience stores
        relation: direct
        direction: higher_is_better
        variables:
          - pct_access_walk_denue_food_retail_300m
          - avg_walk_dist_denue_food_retail
      - id: '169'
        name: Access to petrol station (>= 250 m away)
        relation: direct
        direction: higher_is_better
        notes: >
          A disamenity, so the polarity is carried in the variable name: the
          share of the population living at least 250 m away, citing evidence of
          increased relative risk of childhood leukaemia within that distance.
        variables: [pct_beyond_walk_denue_petrol_station_250m]
      - name: Concentration of services within a five minute walk
        relation: direct
        direction: higher_is_better
        notes: >
          The Mexicali collector-road walkability policy's own wording, measured
          as a 300 m activity centre across food retail, pharmacy, healthcare,
          primary school and community facilities.
        variables:
          - pct_access_walk_activity_centre_services_local_300m
          - pct_access_walk_activity_centre_services_complete_300m

  16:
    core_measure: Health, education and care access
    domains: [Social infrastructure]
    owner: Carl
    sub_variables:
      - id: '180, 246, 379'
        name: Access to educational services
        relation: direct
        direction: higher_is_better
        variables:
          - pct_access_walk_denue_preschool_300m
          - pct_access_walk_denue_primary_school_300m
          - pct_access_walk_denue_secondary_school_300m
          - pct_access_walk_denue_tertiary_education_300m
      - id: '180, 246, 379'
        name: Diversity of available educational services
        relation: direct
        direction: higher_is_better
        notes: >
          Over four levels: preschool, primary, secondary and tertiary.  A school
          combining several levels counts towards each level it serves.
        variables:
          - avg_diversity_walk_education_300m
          - avg_diversity_walk_education_1000m
          - avg_richness_walk_education_300m
          - avg_count_walk_education__preschool_300m
          - avg_count_walk_education__primary_300m
          - avg_count_walk_education__secondary_300m
          - avg_count_walk_education__tertiary_300m
      - id: '97, 101, 170'
        name: Access to health & health care services
        relation: direct
        direction: higher_is_better
        variables:
          - pct_access_walk_denue_primary_healthcare_300m
          - pct_access_walk_denue_medical_clinic_300m
          - pct_access_walk_denue_hospital_300m
          - pct_access_walk_denue_pharmacy_300m
      - id: '97, 101, 170'
        name: Diversity of available health & health care services
        relation: direct
        direction: higher_is_better
        variables:
          - avg_diversity_walk_health_care_300m
          - avg_diversity_walk_health_care_1000m
          - avg_richness_walk_health_care_300m
          - avg_count_walk_health_care__primary_healthcare_300m
          - avg_count_walk_health_care__specialist_clinic_300m
          - avg_count_walk_health_care__hospital_300m
          - avg_count_walk_health_care__pharmacy_300m
          - avg_count_walk_health_care__care_support_300m
      - name: Access to care services
        relation: direct
        direction: higher_is_better
        variables:
          - pct_access_walk_denue_care_support_300m
          - pct_access_walk_denue_childcare_300m
          - avg_walk_dist_denue_childcare

  17:
    core_measure: Community, culture and recreation access
    domains: [Social infrastructure]
    owner: Carl
    sub_variables:
      - id: '4, 46, 58, 121, 134, 225, 228, 257, 394'
        name: Access to community, culture and recreation services
        relation: direct
        direction: higher_is_better
        notes: >
          Delivered as the four functional categories separately rather than
          pooled, which answers the workbook's open question about splitting
          this into community, cultural and recreational.
        variables:
          - pct_access_walk_denue_community_300m
          - pct_access_walk_denue_culture_300m
          - pct_access_walk_denue_sport_300m
          - pct_access_walk_denue_recreation_300m
      - id: '4, 46, 58, 121, 134, 225, 228, 257, 394'
        name: Diversity of community, culture and recreation services
        relation: direct
        direction: higher_is_better
        notes: >
          This is the Calculation guide's "capped weighted diversity score" for
          the community/recreation domain, computed as normalised entropy so the
          cap is inherent rather than applied afterwards.
        variables:
          - avg_diversity_walk_community_culture_recreation_300m
          - avg_diversity_walk_community_culture_recreation_1000m
          - avg_richness_walk_community_culture_recreation_300m
          - avg_count_walk_community_culture_recreation__community_300m
          - avg_count_walk_community_culture_recreation__culture_300m
          - avg_count_walk_community_culture_recreation__sport_300m
          - avg_count_walk_community_culture_recreation__recreation_300m

  18:
    core_measure: Neighborhood parks
    domains: [Social infrastructure]
    owner: Carl
    sub_variables:
      - name: Access to neighbourhood parks
        relation: direct
        direction: higher_is_better
        notes: Same underlying measure as core measure 7; reported once.
        variables:
          - pct_access_500m_public_open_space_any_score
          - avg_walk_dist_public_open_space_any

  19:
    core_measure: Access to employment
    domains: [Economic development]
    owner: Carl
    sub_variables:
      - id: '112'
        name: Reachable jobs
        relation: proxy
        direction: higher_is_better
        notes: >
          DENUE records employment as a size band, not a headcount, so a
          gravity-weighted reachable-jobs score cannot be computed from it.  Per
          the workbook's own note, call this employment-establishment
          accessibility rather than jobs accessibility.
        variables:
          - pct_access_walk_denue_employer_medium_1000m
          - avg_walk_dist_denue_employer_medium
          - pct_access_walk_denue_employment_any_1000m
      - id: '127'
        name: Access to manufacturing district / centre
        relation: direct
        direction: non_monotonic
        notes: >
          Direction is genuinely ambiguous and should not be forced: proximity
          is an employment opportunity and an exposure to air and noise
          pollution at the same time.  Highly relevant as Condesa has
          manufacturing nearby.
        variables: [avg_walk_dist_denue_manufacturing]
      - name: Job diversity
        relation: not_covered
        direction: higher_is_better
        notes: >
          Feasible with the machinery now in place -- a diversity set over SCIAN
          sectors would do it -- but the sub-variable is unassigned and the
          sector grouping has not been agreed.

  22:
    core_measure: Level of Traffic Stress for Cycling
    domains: [Safety, Mobility & Transport, Built Infrastructure]
    owner: Carl
    sub_variables:
      - name: Cycling access and distance to destinations by level of traffic stress
        relation: direct
        direction: higher_is_better
        notes: >
          A suite rather than a single variable, as the workbook notes.  Access
          is reported over the plain cycling network and over the low-stress
          (LTS <= 2) network, the contrast between them being the measure of
          traffic stress.  Note the cycling analysis measures the *global*
          destination set, not the DENUE categories: the region declares its
          destinations under 'pedestrian' precisely so that cycling stays
          comparable with other cities.
        variables:
          - pct_access_cycle_fresh_food_market_1000m
          - pct_access_cycle_safe_fresh_food_market_1000m
          - avg_cycle_dist_fresh_food_market
          - avg_cycle_dist_safe_fresh_food_market

  23:
    core_measure: Walkability Index
    domains: [Built environment, Mobility & Transport, Social Infrastructure]
    owner: Carl
    sub_variables:
      - id: '74'
        name: Walkability index
        relation: complementary
        direction: higher_is_better
        notes: >
          The definitions differ and should not be silently substituted for one
          another.  GHSCI sums z-scores of the daily living score, neighbourhood
          population density and intersection density.  The workbook specifies
          z-scored net residential density + commercial land use proportion +
          2 x connectivity + land use mix.  Both the GHSCI index and its
          components are delivered in natural units so the workbook's version
          can be assembled centrally; land use mix and commercial land use
          proportion come from the municipal land use layer (WP06), not from us.
        variables: [local_walkability, pop_walkability]
      - id: '230, 120, 74'
        name: Net residential density
        relation: proxy
        direction: higher_is_better
        notes: >
          GHSCI computes population density over the walkable neighbourhood, not
          dwelling density over residential land.
        variables: [local_nh_population_density]
      - id: '362, 74'
        name: Street connectivity
        relation: direct
        direction: higher_is_better
        variables: [local_nh_intersection_density]
      - id: '116, 74'
        name: Land use mix
        relation: not_covered
        direction: higher_is_better
        notes: >
          From the municipal land use layer (USOS_DE_SUELO_EXITS_24), not from
          GHSCI.  Note the workbook's formula for it is the same normalised
          entropy used for the diversity measures above, so the two are directly
          comparable in form if not in input.

  24:
    core_measure: Cycling infrastructure presence
    domains: [Safety, Mobility & Transport, Built Infrastructure]
    owner: Alejandro
    sub_variables:
      - name: Bicycle lane coverage
        relation: component
        direction: higher_is_better
        notes: >
          Not assigned to us, but derivable at no extra cost from the level of
          traffic stress network already built: length by LTS class over total
          network length.  Offered rather than assumed.
        variables: []

not_covered:
  - {measure: 1, core_measure: Thermal Comfort, owner: Rossano}
  - {measure: 3, core_measure: Heat exposure, owner: Rossano}
  - {measure: 4, core_measure: Vegetation and shade, owner: Juan}
  - {measure: 9, core_measure: Air-quality exposure, owner: 'not calculated for the workshop'}
  - {measure: 10, core_measure: Proximity to high levels of traffic, owner: Juan}
  - {measure: 11, core_measure: Flooding hazard exposure, owner: Juan}
  - {measure: 12, core_measure: Earthquake vulnerability, owner: 'not calculated for the workshop'}
  - {measure: 20, core_measure: Housing, owner: Juan}
  - {measure: 21, core_measure: Personal and road safety, owner: Alejandro}
  - {measure: 25, core_measure: Housing affordability and adequacy, owner: Juan}
