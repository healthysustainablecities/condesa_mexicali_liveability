lenses:
  proximity: Distance to the closest instance (m), measured along the pedestrian
    network unless otherwise documented
  accessibility: Whether an instance is reachable within a policy-relevant
    threshold; reported as the share of population (or of the unit) meeting
    the threshold
  quantity: Count or amount within an area or threshold distance
  density: Amount relative to another unit (per km², per 1,000 persons, or
    percentage coverage)
  diversity: Mix or evenness (e.g. entropy) within an area
  quality: A graded or composite assessment of condition or suitability
  equity: Distributional summary across the population.  Derived centrally
    from the finest-scale results -- analysts do not compute this lens themselves
    (see the schema document)
lenses_delivered_by_analysts:
- proximity
- accessibility
- quantity
- density
- diversity
- quality
value_types:
  continuous: Unbounded or interval-scaled real number
  count: Non-negative integer count
  proportion: Bounded 0-1
  percentage: Bounded 0-100
  rate: Count per denominator (per capita, per km², per 1,000)
  index: Constructed score, bounded or standardised
  ordinal: Ordered categories encoded as integers
  binary: 0 or 1
directions:
  higher_is_better: A higher value indicates better liveability
  lower_is_better: A higher value indicates worse liveability
  non_monotonic: Neither extreme is desirable; a target range or transform
    must be supplied in the metadata
  descriptive: Context variable; not a candidate for the composite index
aggregation_methods:
  native: Computed directly at this scale; no aggregation applied
  population_weighted_mean: Mean over finer units weighted by resident population
    (use for anything experienced by people)
  area_weighted_mean: Mean over finer units weighted by area (use for land
    cover, coverage and exposure surfaces)
  length_weighted_mean: Mean over network segments weighted by segment length
  sum: Sum of finer units (use for counts and totals)
  areal_share: Area of a feature falling inside the unit, divided by unit
    area
  majority: Modal category of the finer units
  replicated: The value of a coarser unit copied down to finer units; the
    result carries no spatial variation at this scale
  zonal_statistic: Zonal summary of a raster within the unit
  nearest_feature: Value taken from the nearest measurement location (e.g.
    an air quality monitor); document the maximum distance used
  interpolated: Value from a fitted spatial model or interpolation surface
quality_flags:
  ok: Value is fit for use
  low_coverage: Fewer than the required share of the unit had valid input
    data; interpret with caution
  imputed: Value was filled from a model or a neighbouring unit
  suppressed: Value withheld (e.g. small counts risking disclosure); value
    must be empty
  not_applicable: The measure is undefined for this unit (e.g. no resident
    population); value must be empty
  no_data: No input data available for this unit; value empty
denominator_types:
  population: Resident population used to weight or normalise
  area_sqkm: Unit area in km²
  dwellings: Dwelling or lot count
  network_length_km: Pedestrian/road network length in km
  sample_points: Count of network sample points
  none: No denominator applies
evidence_types:
  meta_analysis: Meta-analysis of multiple studies
  systematic_review: Systematic review without pooled estimate
  expert_guidance: Guidance from a reputable body (WHO, UN-Habitat, national
    health authority)
  cohort: Longitudinal / cohort study
  natural_experiment: Natural or quasi-experiment
  case_control: Case-control study
  cross_sectional: Cross-sectional study
  modelling: Health impact assessment or simulation study
  narrative_review: Narrative or scoping review
health_pathways:
  physical_activity_transport: Supports walking or cycling for transport
  physical_activity_recreation: Supports recreational walking, play, sport
    or exercise
  social_interaction: Supports social contact, community participation and
    reduced loneliness
  heat_exposure: Alters exposure to heat and heat stress
  air_pollution_exposure: Alters exposure to air pollutants
  noise_exposure: Alters exposure to noise
  injury_risk: Alters risk of traffic or other injury
  crime_and_safety: Alters crime exposure or perceived safety
  food_environment: Alters access to affordable, healthy food
  healthcare_access: Alters access to health and social services
  education_access: Alters access to education
  economic_security: Alters income, employment or housing cost burden, and
