result_columns:
  indicator_id: Integer '#' of the parent indicator in the ULI workbook
  indicator_code: Stable snake_case slug for the parent indicator
  measure_id: Unique slug for this specific measure, of the form <indicator_code>__<lens>[_<parameter>]
  geo_level: One of the reporting geographies (see GEO_LEVELS)
  geo_id: Identifier of the unit within that geography, exactly as supplied
    in the reference geopackage
  value: The measured value; empty only where quality_flag is suppressed,
    not_applicable or no_data
  denominator: Population, area or other denominator underlying the value
    (type declared per measure in the metadata)
  native_scale: The geography level at which the measure was actually computed
    before aggregation
  aggregation_method: How the native-scale value was carried to this geo_level
  coverage: Share (0-1) of the unit -- by population or area, as declared
    in the metadata -- with valid input data
  quality_flag: One of QUALITY_FLAGS
  note: Optional free text for this row
