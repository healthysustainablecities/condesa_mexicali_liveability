## Externally prepared indicators, linked as delivered (linkage_indicators;
## see process/subprocesses/_linkage_indicators.py).
##
## Both sources are summarised for the reporting areas of
## 'Mexicali Liveability/geography/mexicali_reference_areas.gpkg': the 100 m
## grid (whose area_id is GHSCI's grid_id), AGEBs and manzanas (INEGI cvegeo),
## and the Condesa lots and fraccionamientos (their 'id' and 'fid').  Values
## are linked onto each matching aggregation, summarised for the regions, and
## brought down to sample points -- replicated from the area containing each
## point -- so that the Urban Liveability Index, scored at sample points, can
## use them.
linkage_indicators:
  ## Modelled outdoor thermal comfort (UTCI) on the hottest day of 2023
  ## (21 July; SOLWEIG, MMML airport forcing), over pedestrian surfaces only.
  ## Read the README before publishing figures: air temperature, humidity and
  ## wind are spatially uniform, so only radiant temperature (sun and shade)
  ## varies across the city; most values exceed the UTCI polynomial's fitted
  ## range; and comparisons within a neighbourhood are sound where rankings of
  ## neighbourhoods kilometres apart are not.  Units with fewer than 100
  ## pedestrian pixels are masked ('reliable').
  ##
  ## Only daytime thermal comfort is linked.  Night-time UTCI varies by
  ## fractions of a degree across the city (30.3-30.6 °C): it acts either as a
  ## constant or, once normalised, exaggerates differences that do not matter.
  utci:
    data: MX/UTCI - 2026-08-25/mexicali_utci_2023-07-21.gpkg
    match: id
    id: area_id
    mask: reliable
    label: {es: Confort térmico exterior (UTCI), en: Outdoor thermal comfort (UTCI)}
    source: Rossano Schifanella (WP02); SOLWEIG and the UTCI operational polynomial (Bröde et al. 2012)
    licence: Terrain from FABDEM v1 (CC BY-NC-SA 4.0, non-commercial); other inputs CC BY 4.0 or public domain
    notes: 'Modelled day 2023-07-21 (Tmax 48.5 °C).  See README_mexicali_utci.md, sections 3.1 and 5, for forcing and limitations.'
    columns:
      utci_day_mean:
        label: {es: 'Confort térmico diurno (UTCI medio)', en: 'Daytime thermal comfort (mean UTCI)'}
        units: °C
        direction: lower_is_better
        description: Unit mean of the daytime mean Universal Thermal Climate Index (hours with sunlight), over pedestrian surfaces, on the hottest day of 2023.
      utci_peak:
        label: {es: 'UTCI máximo (17:00)', en: 'Peak UTCI (17:00)'}
        units: °C
        direction: lower_is_better
        description: Unit mean of the daily maximum Universal Thermal Climate Index (effectively 17:00), over pedestrian surfaces, on the hottest day of 2023.
    areas:
      grid: grid_100m
      agebs: agebs
      manzanas: manzanas
      condesa_lotes: {layer: condesa_lotes, boundary_id: id}
      condesa_fraccionamientos: {layer: condesa_fraccionamientos, boundary_id: fid}
      region_mexicali: region
      region_condesa: region
    ## the 100 m grid tiles the study region: sample points lie on streets,
    ## between blocks, so a block layer would leave most of them unvalued
    sample_points: [grid_100m]
  ## Indicators prepared by the ULI work packages (final_indicators.gpkg,
  ## 22 September 2026).  The file carries no identifiers, so features are
  ## identified by geometry against the reference areas: grid, AGEB, lot and
  ## fraccionamiento features are identical to them, and manzanas are matched
  ## by their largest overlap (several delivered parts of one multipart block
  ## are combined as an area weighted mean).
  ##
  ## Missing flood values are taken as no exposure (null_as), which is an
  ## assumption pending confirmation from the work package: without it the
  ## flood indicators would be missing almost everywhere, and so would every
  ## index score using them.  Tree canopy (210 manzanas) and protected cycle
  ## lanes (all but a few zero) are linked for reference only, being too
  ## sparse to use in the index.
  external:
    data: MX/Update_on_ULI - 2026-09-22/final_indicators.gpkg
    match: geometry
    reference: MX/Mexicali Liveability/geography/mexicali_reference_areas.gpkg
    reference_layers: {grid: grid_100m}
    prefix: ext_
    label: {es: Indicadores de los paquetes de trabajo, en: Work package indicators}
    source: Mexicali ULI work packages (final_indicators.gpkg; see excel_work_sheet_key.xlsx)
    null_as: {pop_affected_flood: 0, flood_area_m2: 0}
    columns:
      ndvi:
        label: {es: Cobertura vegetal (NDVI), en: Vegetation cover (NDVI)}
        units: NDVI
        direction: higher_is_better
      tree_canopy_pct:
        label: {es: Cobertura arbórea, en: Tree canopy cover}
        units: '%'
        direction: higher_is_better
      avg_walk_dist_park_m:
        label: {es: Distancia a parques (paquete de trabajo), en: Distance to parks (work package)}
        units: m
        direction: lower_is_better
      major_road_length_300m:
        label: {es: Vialidades principales en 300 m, en: Major roads within 300 m}
        units: m
        direction: lower_is_better
      pop_affected_flood:
        label: {es: Población expuesta a inundaciones, en: Population exposed to flooding}
        units: persons
        direction: lower_is_better
      flood_area_m2:
        label: {es: Área de inundación en vialidades principales, en: Flooded area on main roads}
        units: m²
        direction: lower_is_better
      block_perimeter_m:
        label: {es: Tamaño de manzana (perímetro), en: Block size (perimeter)}
        units: m
        direction: lower_is_better
      residential_area_ha:
        label: {es: Uso de suelo residencial, en: Residential land use}
        units: ha
      commercial_area_ha:
        label: {es: Uso de suelo comercial, en: Commercial land use}
        units: ha
      land_use_entropy:
        label: {es: Mezcla de usos de suelo, en: Land use mix}
        units: index 0-1
        direction: higher_is_better
      economic_sector_diversity:
        label: {es: Diversidad de empleos, en: Job diversity}
        units: index 0-1
        direction: higher_is_better
      protected_cycling_street_pct:
        label: {es: Cobertura de ciclovías protegidas, en: Protected cycle lane coverage}
        units: '%'
        direction: higher_is_better
    areas:
      grid: grid
      agebs: agebs
      manzanas: manzanas
      condesa_lotes: {layer: condesa_lotes, boundary_id: id}
      condesa_fraccionamientos: {layer: condesa_fraccionamientos, boundary_id: fid}
    ## the grid first, as it tiles the region; flood values exist only for
    ## blocks and lots, so points take them from the nearest within the
    ## distance each is aggregated over
    sample_points:
      - {layer: grid}
      - {layer: condesa_lotes, within: 15}
      - {layer: manzanas, within: 30}

## Walkability at 300 m, and walkability attenuated by thermal comfort
## (walkability_variants; see process/subprocesses/_walkability_variants.py).
##
## The Mexicali walkability index judges its daily living score -- access to a
## fresh food market, a convenience store and public transport -- at 300 m,
## the five minute walk of the city's own walkability policy, and is z-scored
## with local population and intersection density as the GHSCI index is.
##
## It is also attenuated by daytime thermal comfort ('t', the daytime mean
## UTCI): the index's percentile rank is multiplied by (1 - 0.5 h'), where h'
## is thermal comfort re-scaled to 0-1 between 30 and 50 °C, so that shade
## cannot make up for having nothing to walk to.  The fixed range judges heat
## absolutely: on the modelled day most of the city lies between 43.8 and
## 46.0 °C (its 5th and 95th percentiles), all of it very hot, and re-scaling
## between those percentiles would have treated the least hot as comfortable
## (decided 25 September 2026).  30 °C lies in UTCI's moderate heat stress
## band (26-32 °C), and 50 °C beyond its extreme heat stress threshold (46 °C).  The attenuated form is
## the ULI's default (sp_walk_idx_300_tm).  The daytime mean is used rather
## than the 17:00 peak: it spans the daylight hours in which people walk, and
## it is the peak that most exceeds the UTCI polynomial's fitted range.  The
## percentile bounds used are recorded with the results, and the dashboard
## plots the attenuation they imply.
##
## (Additive forms, the 500 m distance and GUHVI adjustments were explored in
## September 2026 and retired: the ULI dashboard offers attenuation on or off.)
walkability_variants:
  distances: [300]
  daily_living: [fresh_food_market, convenience, pt_any]
  heat:
    t: {variable: sp_utci_day_mean, range: [30, 50], label: {es: confort térmico, en: thermal comfort}}
  sets: [t]
  forms: [multiplicative]
  attenuation: 0.5
  percentiles: [5, 95]

## Índice de entornos vivibles para Mexicali (Urban Liveability Index).
##
## Indicators.  Every sub-variable of the project's ULI variable sheet
## (Update_on_ULI - 2026-09-22/excel_work_sheet_key.xlsx, sheet 'Current
## version of subvariable-', revised 25 September 2026) whose data have been
## delivered and vary across the city, marked in its column A or not.  Where
## the sheet pairs 'access to X' with 'percentage of the population with
## access to X', one indicator serves both: at a sample point they are the same
## measure.  Whether each is appropriate is to be investigated once the index
## is built.
##
## Domains.  The sheet assigns many sub-variables to several domains of the
## Adapted Urban Liveability Framework: walkability to the built environment,
## mobility and transport, and social infrastructure, say.  Each indicator is
## listed once with every domain the sheet gives it ('domains'), and counts an
## equal share of its weight in each (a third in each of three), so that its
## shares add up to the weight of an indicator in one domain alone: shared
## indicators gain no extra weight (decided 25 September 2026).  Its score is
## the same in each domain.  The sheet's 'Built Infrastructure' is read as the
## built environment.  Domains are listed alphabetically (in English), as the
## dashboard presents them; Housing and Sociodemographic characteristics have
## no indicator yet, and are described but not scored.
##
## Because each domain is an equal pillar of the index, an indicator's
## effective weight still depends on how many others share its domains: each
## of Safety's five counts for about 6% of the index's mean level, and each of
## social infrastructure's eight access and diversity indicators for under 2%.
## The effective weights are recorded with the parameters and shown on the
## dashboard.  Shared indicators also make the domains' scores move together,
## so the index penalises imbalance between domains less.  Against placing
## each indicator in the first domain the sheet names (25 September 2026):
## mean penalty 0.48 rather than 1.08, effective weights 1.7-6.2% rather than
## 1.4-16.7% (public transport alone would have been all of mobility), and a
## rank correlation of 0.97 between the two
## (Mexicali Liveability/build/_work/uli_sharing_sensitivity.py).
##
## Thermal comfort (core measure 1, daytime UTCI) enters in one of two ways,
## never both:
##   - by default, through walkability attenuated by thermal comfort
##     (sp_walk_idx_300_tm; see walkability_variants above), in which case the
##     ambient thermal comfort indicator is listed but inactive;
##   - in the 'plain' variant (uli_plain), walkability is not attenuated and
##     thermal comfort is scored as an ambient environment indicator instead.
##
## Deliberately not included (see the sheet's rows):
##   - flooding (population exposed; flooded area on main roads): the delivered
##     values are missing for almost every area (none on the grid), pending the
##     work package's reply on whether missing means no exposure;
##   - tree canopy (210 manzanas, no grid values) and protected cycle lanes
##     (almost all zero) are too sparse to vary;
##   - heat exposure (core measure 3: land surface temperature, extreme heat
##     frequency, night-time heat retention) awaits delivery, as do sidewalk
##     coverage, street lighting, bicycle lane coverage, reachable jobs and
##     access to basic services (Housing);
##   - crime exposure is one municipal rate for every location, so it cannot
##     distinguish between them;
##   - large public open space availability (the share of an area's land
##     that is large public green space) describes an area, not a sample
##     point, so has no sample point form yet; access to large public green
##     space, from the core GHSCI workflow, is included (lpugs);
##   - net residential density, commercial land use and land use mix
##     (final_indicators.gpkg) are the components of the walkability core
##     measure, which walkability itself represents: scoring them as well would
##     count density twice.  They remain in the general dashboard;
##   - night-time thermal comfort varies too little within the city.
##
## Police and fire station coverage use the thresholds the work package
## revised (2 km and 3 km, straight-line, as NFPA 1710's four minute response
## at 45 km/h; the 15 km and 70 km first proposed cover the whole city) as soft
## thresholds on the straight-line distances already measured
## (accessibility.euclidean).
##
## Method: the Adjusted Mazziotta-Pareto Index (AMPI; Mazziotta & Pareto
## 2018), building on the Urban Liveability Index of Higgs et al. (2019).
## Each indicator is re-scaled against goalposts spanning its observed range
## and centred on its mean over the study region's sample points (the GUHVI
## sub-indices use their own 0-100 scale as goalposts).  Scores are calculated
## with that mean at 100, since the penalty divides by the mean level, and
## reported less 100 ('centre: 0'), so that 0 means 'as good as the study
## region average'.  A domain's score is the weighted mean of its re-scaled
## indicators less a penalty for how unbalanced they are, so that doing well
## on one cannot wholly make up for doing badly on another; the index is the
## same composite of the domain scores (weighted form, Mazziotta & Pareto
## 2022).  An indicator in k domains counts 1/k of its weight in each.
## Scores are computed at sample points, averaged to grid cells, and
## summarised for larger areas as population-weighted averages.
##
## The goalposts used are written to
## MX_Mexicali_2025_ULI_composite_<name>_parameters.yml.  Scores are
## comparable over time only against the same goalposts.
##
## Distances enter through soft thresholds rather than as binary access (0.5
## at the threshold, 0 where nothing was found within the distance searched),
## except natural blue space, scored by the sheet's ladder ('steps').
##
## 'group' (the sheet's core measure), 'subdomain', 'description', 'about' and
## 'sources' are presentation only; they alter no score.  Domain and subdomain
## definitions are the sheet's 'domain definitions'.  The Spanish core measure
## names were drafted on 25 September 2026 and await review, as does the
## 'about' and 'sources' text of each indicator.
composite_indices:
  uli:
    label:
      es: Índice de entornos vivibles para Mexicali
      en: Mexicali Urban Liveability Index
    description:
      es: Promedio de las puntuaciones de los dominios del Índice de entornos vivibles para Mexicali, cada una resumen de sus subindicadores normalizados, menos una penalización por la variación entre dominios que premia un desempeño equilibrado. Se expresa en puntos por encima o por debajo del promedio de la región de estudio (0).
      en: Average of the Mexicali Urban Liveability Index's domain scores, each summarising its normalised sub-indicators, less a penalty for variation across domains that rewards balanced performance. Expressed as points above or below the study region average (0).
    about:
      es: 'El Índice de entornos vivibles se basa en el Índice ajustado de Mazziotta-Pareto (AMPI): cada subindicador se reescala de modo que 0 es el promedio de la región de estudio (su media en todos los puntos de muestra), y las puntuaciones son puntos por encima o por debajo de él. Cada dominio es la media ponderada de sus subindicadores menos una penalización por el desequilibrio entre ellos, y el índice es, del mismo modo, la media de los dominios menos una penalización por el desequilibrio entre dominios. Un subindicador que atañe a varios dominios cuenta en cada uno con una parte igual de su peso (un tercio en cada uno de tres), de modo que en total no pesa más que uno de un solo dominio. Se calcula en puntos de muestra a lo largo de la red peatonal, se promedia a las celdas de la cuadrícula y, ponderado por población, a áreas mayores.'
      en: 'The Urban Liveability Index draws on the Adjusted Mazziotta-Pareto Index (AMPI): each sub-indicator is re-scaled so that 0 is the study region average (its mean over all sample points), and scores are points above or below it. Each domain is the weighted mean of its sub-indicators less a penalty for imbalance between them, and the index is likewise the mean of the domains less a penalty for imbalance between domains. A sub-indicator bearing on several domains counts an equal share of its weight in each (a third in each of three), so that in all it weighs no more than one in a single domain. Scored at sample points along the pedestrian network, and averaged to grid cells and, weighted by population, to larger areas.'
    sources:
      - 'Mazziotta, M. & Pareto, A. (2018) Measuring well-being over time: the Adjusted Mazziotta-Pareto Index versus other non-compensatory indices. Social Indicators Research 136, 967-976.'
      - 'Mazziotta, M. & Pareto, A. (2022) Weighted composite indices: the case of the Mazziotta-Pareto Index. Rivista Italiana di Economia Demografia e Statistica 76(4), 17-26.'
      - 'Higgs, C. et al. (2019) The Urban Liveability Index: developing a policy-relevant urban liveability composite measure and evaluating associations with transport mode choice. International Journal of Health Geographics 18, 14.'
      - 'OECD & JRC (2008) Handbook on Constructing Composite Indicators: Methodology and User Guide. OECD Publishing, Paris.'
      - 'Population: GHS-POP R2023A (JRC) and INEGI Censo 2020; Condesa lots at an assumed 3.2 residents each.'
    method: ampi
    ## Scores are reported as points above or below the reference (the study
    ## area's average), 0, rather than about 100: calculated on the scale
    ## centred at 100, as the penalty divides by the mean, then less 100
    ## (decided 25 September 2026).
    centre: 0
    ## Presentation colours are those of the Adapted Urban Liveability
    ## Framework figure (Urban Liveability Mexicali - English.pdf), read from
    ## the PDF by "Mexicali Liveability/build/conceptual_model_svg.py".
    colour: '#4E8EF7'
    domains:
      ambient_environment:
        label: {es: 'Entorno medioambiental', en: 'Ambient environment'}
        colour: {fill: '#D9F4CD', stroke: '#2E6417'}
        about:
          es: 'La calidad de las condiciones ambientales a las que están expuestos los residentes a diario. Ejemplos: aire, agua, ruido y temperatura.'
          en: 'The quality of environmental conditions to which residents are exposed every day. Examples include air, water, noise and temperature.'
        subdomains:
          climate_risks:
            label: {es: 'Riesgos climáticos', en: 'Climate risks'}
            about:
              es: 'Los efectos del cambio climático a escala de barrio y la capacidad para adaptarse a ellos y mitigarlos. Ejemplos: islas de calor, riesgo de inundaciones y fenómenos meteorológicos extremos.'
              en: 'The effects of climate change at neighbourhood scale and the capacity to adapt to and mitigate them. Examples include heat islands, flood risk and extreme weather events.'
          ambient:
            label: {es: 'Medioambiente', en: 'Ambient'}
            about:
              es: 'Condiciones biofísicas y ambientales del entorno inmediato, que abarcan factores como ruido, agua, suelo, vegetación y confort térmico, que inciden de manera directa en la salud, la comodidad y el bienestar físico de los habitantes.'
              en: 'Biophysical and environmental conditions of the immediate surroundings, encompassing factors such as noise, water, soil, vegetation and thermal comfort, which directly affect residents’ health, comfort and physical well-being.'
          natural_resources:
            label: {es: 'Recursos', en: 'Natural resources'}
            about:
              es: 'Disponibilidad, acceso, preservación y gestión sostenible de los recursos naturales y servicios básicos esenciales, como el agua, la tierra y el manejo de residuos sólidos, fundamentales para el sostenimiento ecológico y el funcionamiento continuo de la comunidad.'
              en: 'Availability, access, preservation and sustainable management of natural resources and essential basic services, such as water, land and solid-waste management, which are fundamental to ecological sustainability and the community’s continued functioning.'
      built_environment:
        label: {es: 'Ambiente construido', en: 'Built environment'}
        colour: {fill: '#FFC2E8', stroke: '#FF66C4'}
        about:
          es: 'El entorno físico creado por el ser humano, cuya densidad, combinación de usos del suelo y conectividad dan forma a la vida cotidiana. Ejemplos: edificios, calles y espacios públicos.'
          en: 'The physical environment created by people, whose density, mix of land uses and connectivity shape everyday life. Examples include buildings, streets and public spaces.'
        subdomains:
          urban_morphology:
            label: {es: 'Morfología urbana', en: 'Urban morphology'}
            about:
              es: 'La forma física, la estructura y el diseño del tejido urbano, elementos que determinan cómo se organiza el espacio y cómo influye esto en la experiencia de habitar la ciudad.'
              en: 'The physical form, structure and design of the urban fabric, which determine how space is organised and how this influences the experience of living in the city.'
          urban_design:
            label: {es: 'Diseño urbano', en: 'Urban design'}
            about:
              es: 'Configuración y calidad de los espacios, calles y elementos que conforman la ciudad, incluyendo la infraestructura peatonal, ciclista y vial, así como el paisaje urbano, que influyen en la movilidad, la accesibilidad, la seguridad, la conectividad y la experiencia cotidiana de las personas.'
              en: 'Configuration and quality of the spaces, streets and elements that make up the city, including pedestrian, cycling and road infrastructure, as well as the urban landscape, which influence mobility, accessibility, safety, connectivity and people’s everyday experience.'
          green_blue_infrastructure:
            label: {es: 'Infraestructura verde y azul', en: 'Green and blue infrastructure'}
            about:
              es: 'Red de espacios verdes y elementos acuáticos, como parques, árboles, ríos, canales, humedales y sistemas de gestión de aguas pluviales, que proporcionan servicios ecosistémicos, contribuyen a la regulación climática, favorecen la actividad física y las actividades recreativas, y promueven la salud mental.'
              en: 'Network of green spaces and water features, such as parks, trees, rivers, canals, wetlands and stormwater-management systems, that provide ecosystem services, contribute to climate regulation, support physical activity and recreation, and promote mental health.'
      economic_development:
        label: {es: 'Desarrollo económico', en: 'Economic development'}
        colour: {fill: '#CAF5F7', stroke: '#0CC0DF'}
        about:
          es: 'Las condiciones económicas locales que ofrecen a los residentes oportunidades de empleo productivo, ingresos justos y participación económica.'
          en: 'Local economic conditions that offer residents opportunities for productive employment, fair income and economic participation.'
        subdomains:
          food_environment:
            label: {es: 'Ambiente de alimentación', en: 'Food environment'}
            about:
              es: 'Presencia, proximidad y diversidad de establecimientos de abasto de alimentos, tales como supermercados y destinos de conveniencia, que determinan la facilidad y equidad con la que los habitantes acceden a insumos alimenticios en su entorno inmediato.'
              en: 'Presence, proximity and diversity of food retail establishments, such as supermarkets and convenience destinations, that determine the ease and equity with which residents access food supplies in their immediate surroundings.'
          resources:
            label: {es: 'Recursos', en: 'Resources'}
            about:
              es: 'Disponibilidad, acceso, cobertura y suministro continuo de servicios e insumos energéticos esenciales, como la energía eléctrica y combustibles, necesarios para el funcionamiento de las actividades productivas, comerciales y del hogar.'
              en: 'Availability, access, coverage and continuous supply of essential energy services and inputs, such as electricity and fuels, needed for productive, commercial and household activities.'
          economy:
            label: {es: 'Economía', en: 'Economy'}
            about:
              es: 'Dinamismo y estructura de la actividad productiva local, que abarca la presencia y distribución del comercio minorista, la industria y las fuentes de empleo, los cuales generan oportunidades laborales, ingresos y sustento económico para la población urbana.'
              en: 'Dynamism and structure of local productive activity, including the presence and distribution of retail, industry and employment sources, which generate job opportunities, income and economic support for the urban population.'
      housing:
        label: {es: 'Vivienda', en: 'Housing'}
        colour: {fill: '#C2CDFF', stroke: '#4F81BD'}
        about:
          es: 'La disponibilidad, la asequibilidad y la idoneidad de las opciones de vivienda que satisfacen las diversas necesidades de los residentes de una colonia.'
          en: 'The availability, affordability and suitability of housing options that meet the diverse needs of neighbourhood residents.'
      mobility_transport:
        label: {es: 'Movilidad y transporte', en: 'Mobility and transport'}
        colour: {fill: '#C7FAE9', stroke: '#3BBFA3'}
        about:
          es: 'Las redes y los sistemas que permiten desplazarse de forma eficiente entre el hogar, el trabajo y los servicios.'
          en: 'Networks and systems that enable efficient travel between home, work and services.'
        subdomains:
          public_transport:
            label: {es: 'Transporte público', en: 'Public transport'}
            about:
              es: 'Los sistemas de transporte público que conectan a los residentes con el trabajo, la educación y los servicios.'
              en: 'Public transport systems that connect residents with work, education and services.'
          active_mobility:
            label: {es: 'Movilidad activa', en: 'Active mobility'}
            about:
              es: 'Las condiciones del entorno urbano que facilitan los medios de transporte no motorizados, a pie y en bicicleta, como las redes viarias conectadas, permeables y bien diseñadas.'
              en: 'Urban environment conditions that facilitate non-motorised travel, on foot and by bicycle, such as connected, permeable and well-designed street networks.'
      safety:
        label: {es: 'Seguridad y protección', en: 'Safety and protection'}
        colour: {fill: '#FFD6D6', stroke: '#F7A94F'}
        ## Every indicator of this domain also belongs to another: safety is a
        ## lens on them, as the sheet intends, rather than a set of its own.
        about:
          es: 'Las condiciones del entorno urbano que permiten a los residentes moverse con libertad y participar en la vida pública sin temor a la delincuencia, la violencia o los accidentes de tráfico.'
          en: 'Conditions in the urban environment that allow residents to move freely and participate in public life without fear of crime, violence or traffic accidents.'
        subdomains:
          personal_safety:
            label: {es: 'Seguridad personal', en: 'Personal safety'}
            about:
              es: 'Condiciones del entorno urbano relacionadas con la incidencia delictiva y la presencia de servicios públicos y de vigilancia que determinan el grado de protección física de las personas, reduciendo la exposición al crimen y favoreciendo la tranquilidad en el espacio público.'
              en: 'Conditions in the urban environment related to crime incidence and the presence of public and surveillance services that determine the degree of people’s physical protection, reduce exposure to crime and promote peace of mind in public space.'
          road_safety:
            label: {es: 'Seguridad vial', en: 'Road safety'}
            about:
              es: 'Características y condiciones de la infraestructura vial y peatonal diseñadas para prevenir siniestros de tránsito, protegiendo la integridad física de peatones, ciclistas y conductores al desplazarse por la ciudad.'
              en: 'Characteristics and conditions of road and pedestrian infrastructure designed to prevent traffic crashes, protecting the physical integrity of pedestrians, cyclists and drivers travelling through the city.'
          risks:
            label: {es: 'Riesgos', en: 'Risks'}
            about:
              es: 'Exposición y vulnerabilidad de la población frente a amenazas de origen natural o antrópico, tales como sismos, inundaciones, calor extremo, fuego y eventos climáticos adversos, así como la capacidad del entorno urbano para mitigar sus impactos y salvaguardar a la comunidad.'
              en: 'Population exposure and vulnerability to natural or human-caused hazards, such as earthquakes, flooding, extreme heat, fire and adverse climate events, as well as the urban environment’s capacity to mitigate their impacts and safeguard the community.'
      social_infrastructure:
        label: {es: 'Infraestructura social', en: 'Social infrastructure'}
        colour: {fill: '#FFE7C2', stroke: '#FFBD59'}
        about:
          es: 'La red de equipamientos públicos que favorecen la interacción social, la cohesión y el bienestar colectivo.'
          en: 'The network of public facilities that supports social interaction, cohesion and collective well-being.'
        subdomains:
          public_services:
            label: {es: 'Servicios públicos', en: 'Public services'}
            about:
              es: 'Conjunto de instalaciones, equipamientos, redes y atenciones gubernamentales o comunitarias básicas, orientadas al bienestar, la gestión urbana y el soporte de la vida cotidiana, cuya disponibilidad, cobertura y adecuado funcionamiento garantizan condiciones dignas, seguras y equitativas para la población en el entorno urbano.'
              en: 'Set of essential government or community facilities, equipment, networks and services oriented toward well-being, urban management and support for daily life; their availability, coverage and proper operation ensure dignified, safe and equitable conditions for the population in the urban environment.'
          health_healthcare:
            label: {es: 'Salud y atención sanitaria', en: 'Health and healthcare'}
            about:
              es: 'Las instalaciones y los servicios sanitarios que contribuyen al bienestar físico y mental de los residentes.'
              en: 'Facilities and health services that contribute to residents’ physical and mental well-being.'
          community_culture_recreation:
            label: {es: 'Comunidad, cultura y recreación', en: 'Community, culture and recreation'}
            about:
              es: 'Los espacios culturales, los lugares de interés patrimonial y los eventos comunitarios que fomentan la identidad y el sentido de pertenencia.'
              en: 'Cultural spaces, heritage sites and community events that foster identity and a sense of belonging.'
          education:
            label: {es: 'Educación', en: 'Education'}
            about:
              es: 'Las instituciones educativas, desde la primera infancia hasta la enseñanza superior, que favorecen el desarrollo humano y la movilidad social.'
              en: 'Educational institutions, from early childhood through higher education, that support human development and social mobility.'
      sociodemographics:
        label: {es: 'Características sociodemográficas', en: 'Sociodemographic characteristics'}
        colour: {fill: '#FFF3C2', stroke: '#CCA300'}
        about:
          es: 'Las características de la población, como la edad, los ingresos, el nivel educativo y la composición de los hogares, que determinan cómo se percibe la calidad de vida en los distintos grupos.'
          en: 'Characteristics of the population, such as age, income, educational attainment and household composition, that determine how quality of life is perceived across different groups.'
        subdomains:
          population:
            label: {es: 'Población', en: 'Population'}
            about:
              es: 'Características de las personas que habitan un territorio, como edad, género, ingresos, nivel educativo, ocupación y distribución poblacional, que permiten identificar diferencias en la calidad de vida entre grupos.'
              en: 'Characteristics of people living in an area, such as age, gender, income, educational attainment, occupation and population distribution, which make it possible to identify differences in quality of life between groups.'
          household:
            label: {es: 'Hogar', en: 'Household'}
            about:
              es: 'Características de los hogares, como su composición, tamaño, ingresos, condiciones de vivienda y nivel educativo de sus integrantes, que influyen en la percepción de la calidad de vida.'
              en: 'Characteristics of households, such as their composition, size, income, housing conditions and members’ educational attainment, which influence the perception of quality of life.'
          city:
            label: {es: 'Ciudad', en: 'City'}
            about:
              es: 'Características sociodemográficas de la población y los hogares que habitan una ciudad, así como su distribución territorial y condiciones socioeconómicas, que influyen en la percepción de la calidad de vida en sus distintas zonas.'
              en: 'Sociodemographic characteristics of the population and households living in a city, as well as their spatial distribution and socioeconomic conditions, which influence the perception of quality of life across its different areas.'
    ## One entry per indicator, naming every domain the sheet assigns it
    ## (an equal share of its weight in each).  'subdomain' may be given per
    ## domain, as a shared indicator may answer to a different part of each.
    indicators:
      ## -- Ambient environment ------------------------------------------------
      ## Core measure 2: the GUHVI's three sub-indices, as the sheet lists them.
      ## Each is itself min-max normalised to 0-100, so those are its
      ## goalposts.  Requires the Earth Engine container.
      - variable: sp_urban_heat_exposure_index
        name: heat_exposure
        domains: [ambient_environment]
        polarity: negative
        goalposts: {min: 0, max: 100}
        lens: quality
        group: {es: 'Índice Global de Vulnerabilidad Urbana al Calor (GUHVI)', en: 'Global Urban Heat Vulnerability Index (GUHVI)'}
        label: {es: 'Exposición al calor (GUHVI)', en: 'Heat exposure (GUHVI)'}
        reading: {es: 'Índice de exposición al calor de {value} (0-100; menor es mejor)', en: 'Heat exposure index of {value} (0-100; lower is better)'}
        subdomain: {es: 'Riesgos climáticos', en: 'Climate risks'}
        about:
          es: Subíndice de exposición al calor del GUHVI (0-100), a partir de la temperatura de la superficie terrestre; menor es mejor.
          en: The GUHVI's heat exposure sub-index (0-100), from land surface temperature; lower is better.
        sources:
          - 'Turner et al. (2025) Urban Climate 64, 102716; computed in Google Earth Engine by GHSCI.'
      - variable: sp_urban_heat_sensitivity_index
        name: heat_sensitivity
        domains: [ambient_environment]
        polarity: negative
        goalposts: {min: 0, max: 100}
        lens: quality
        group: {es: 'Índice Global de Vulnerabilidad Urbana al Calor (GUHVI)', en: 'Global Urban Heat Vulnerability Index (GUHVI)'}
        label: {es: 'Sensibilidad al calor (GUHVI)', en: 'Heat sensitivity (GUHVI)'}
        reading: {es: 'Índice de sensibilidad al calor de {value} (0-100; menor es mejor)', en: 'Heat sensitivity index of {value} (0-100; lower is better)'}
        subdomain: {es: 'Riesgos climáticos', en: 'Climate risks'}
        about:
          es: Subíndice de sensibilidad al calor del GUHVI (0-100), a partir del albedo, la vegetación, las zonas climáticas locales, la densidad de población y la población vulnerable; menor es mejor.
          en: The GUHVI's heat sensitivity sub-index (0-100), from albedo, vegetation, local climate zones, population density and the vulnerable population; lower is better.
        sources:
          - 'Turner et al. (2025) Urban Climate 64, 102716; computed in Google Earth Engine by GHSCI.'
      - variable: sp_urban_heat_adaptive_capability_index
        name: adaptive_capability
        domains: [ambient_environment]
        polarity: positive
        goalposts: {min: 0, max: 100}
        lens: quality
        group: {es: 'Índice Global de Vulnerabilidad Urbana al Calor (GUHVI)', en: 'Global Urban Heat Vulnerability Index (GUHVI)'}
        label: {es: 'Capacidad de adaptación al calor (GUHVI)', en: 'Heat adaptive capability (GUHVI)'}
        reading: {es: 'Índice de capacidad de adaptación de {value} (0-100; mayor es mejor)', en: 'Adaptive capability index of {value} (0-100; higher is better)'}
        subdomain: {es: 'Riesgos climáticos', en: 'Climate risks'}
        about:
          es: Subíndice de capacidad de adaptación del GUHVI (0-100), a partir de la razón de dependencia infantil, el índice de desarrollo humano subnacional y la mortalidad infantil; mayor es mejor.
          en: The GUHVI's adaptive capability sub-index (0-100), from the child dependency ratio, the subnational human development index and infant mortality; higher is better.
        sources:
          - 'Turner et al. (2025) Urban Climate 64, 102716; computed in Google Earth Engine by GHSCI.'
      ## Core measure 1.  Scored only where walkability is not attenuated by
      ## it (the 'plain' variant); otherwise it would count twice.
      - variable: sp_utci_day_mean
        name: thermal_comfort
        domains: [ambient_environment]
        polarity: negative
        lens: quality
        active: false
        inactive_reason:
          es: Incluido mediante la atenuación de la caminabilidad por confort térmico. Elija la caminabilidad sin atenuación para puntuarlo aquí.
          en: Included through walkability's thermal comfort attenuation. Choose walkability without attenuation to score it here.
        group: {es: 'Confort térmico', en: 'Thermal comfort'}
        label: {es: 'Confort térmico diurno', en: 'Daytime thermal comfort'}
        reading: {es: 'UTCI diurno medio de {value} en superficies peatonales en el día más caluroso de 2023', en: 'Mean daytime UTCI of {value} on pedestrian surfaces on the hottest day of 2023'}
        subdomain: {es: 'Medioambiente', en: 'Ambient'}
        about:
          es: Índice Universal de Clima Térmico (UTCI) medio durante las horas de sol en superficies peatonales, modelado para el día más caluroso de 2023; menor es mejor.
          en: Mean Universal Thermal Climate Index (UTCI) over sunlit hours on pedestrian surfaces, modelled for the hottest day of 2023; lower is better.
        sources:
          - 'Rossano Schifanella (WP02): SOLWEIG, forced by Mexicali airport observations for 21 July 2023; UTCI operational polynomial (Bröde et al. 2012).'
      ## Core measure 7: the sheet's scoring for water bodies in arid cities,
      ## 100 within 200 m, 90 within 500 m, 80 within 1000 m, and 60 beyond --
      ## water mattering enough in an arid city that its lowest score is 60.
      - variable: sp_walk_nearest_node_blue_space
        domains: [ambient_environment]
        transform: {steps: [[200, 100], [500, 90], [1000, 80], [1500, 60]], beyond: 60}
        group: {es: 'Espacios azules naturales disponibles', en: 'Available natural blue spaces'}
        label: {es: 'Espacios azules naturales cercanos', en: 'Natural blue space nearby'}
        reading: {es: '{access} de la población vive a menos de 500 m de un cuerpo de agua; en promedio, el más cercano está a {value}', en: '{access} of the population live within 500 m of a water body; on average the nearest is {value} away'}
        reading_columns: {access: pct_access_walk_blue_space_500m}
        subdomain: {es: 'Medioambiente', en: 'Ambient'}
        about:
          es: Distancia a pie al cuerpo de agua más cercano, puntuada con la escala del proyecto para ciudades áridas (100 a 200 m, 90 a 500 m, 80 a 1 km y 60 más allá).
          en: Walking distance to the nearest water body, scored by the project's scale for arid cities (100 within 200 m, 90 within 500 m, 80 within 1 km, and 60 beyond).
        sources:
          - 'OpenStreetMap contributors (Geofabrik Mexico extract, 15 August 2026).'
      ## -- Ambient and built environment -------------------------------------
      - variable: sp_ext_ndvi
        name: vegetation
        domains: [ambient_environment, built_environment]
        polarity: positive
        lens: quality
        group: {es: 'Vegetación y sombra', en: 'Vegetation and shade'}
        label: {es: 'Cobertura vegetal (NDVI)', en: 'Vegetation cover (NDVI)'}
        reading: {es: 'Índice de vegetación (NDVI) medio de {value}', en: 'Mean vegetation index (NDVI) of {value}'}
        subdomain:
          ambient_environment: {es: 'Medioambiente', en: 'Ambient'}
          built_environment: {es: 'Infraestructura verde y azul', en: 'Green and blue infrastructure'}
        about:
          es: Índice de vegetación de diferencia normalizada (NDVI) medio; mayor es mejor.
          en: Mean normalised difference vegetation index (NDVI); higher is better.
        sources:
          - 'Mexicali ULI work packages (final_indicators.gpkg, 22 September 2026).'
      - variable: sp_walk_nearest_node_public_open_space_any
        name: parks
        domains: [ambient_environment, built_environment]
