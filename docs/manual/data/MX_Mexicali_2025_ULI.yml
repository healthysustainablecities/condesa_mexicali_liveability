###########################################################
## Mexicali Urban Liveability Index (ULI) study region.
##
## Purpose: produce multiscale indicator summaries for the Mexicali
## urban area and the Condesa development, at the scales the ULI
## output specification requires -- 100 m population grid, manzanas,
## AGEBs, and region -- in EPSG:6366, from a single analysis so that
## every scale is internally consistent.
##
## Differs from the earlier MX_Mexicali_2025-* configurations in
## three deliberate ways:
##
## 1. The population source is the GHS-POP 2025 raster rather than
##    vector AGEB counts.  GHSCI reprojects it from Mollweide to the
##    project CRS using sum resampling (conserving population counts;
##    see _utils.reproject_raster) and vectorises it, which is what
##    produces the required 100 m grid.  A vector population source
##    produces no grid at all.
##
## 2. 'custom_population' is deliberately NOT set.  Setting it would
##    redirect the grid summary to the named aggregation, leaving no
##    100 m grid output.
##
## 3. The study region is the union of the Mexicali urban area and
##    the Condesa development, dissolved to a single feature.  Only
##    82% of Condesa falls inside lim_aumxl24, so the administrative
##    boundary alone would clip 2,419 of its 14,989 lots.  The
##    boundary must be a single feature because with
##    'urban_intersection: false' GHSCI creates one study region row
##    per boundary feature.
# yamllint disable rule:line-length
###########################################################
---
name: Mexicali
year: 2025
country: México
country_code: MX
continent: North America
crs:
  name: Mexico ITRF2008 / UTM zone 11N
  standard: EPSG
  srid: 6366
study_region_boundary:
  ## Union of the Mexicali urban area (IMIP lim_aumxl24) and the
  ## Condesa development, dissolved to one feature; see
  ## MX/CFC/build_uli_boundaries.py
  data: MX/INEGI-02l-NOMGEO-Mexicali-Condesa-Fraccionamientos.geojson
  source: Instituto Nacional de Estadística, Geografía e Informática (INEGI); Centro para el Futuro de las Ciudades (CFC) 
  publication_date: 2025-07-31
  url: https://en.www.inegi.org.mx/contenidos/productos/prod_serv/contenidos/espanol/bvinegi/productos/geografia/marcogeo/794551163061/02_bajacalifornia.zip
  licence: Términos de Libre Uso de la Información del INEGI https://www.inegi.org.mx/inegi/terminos.html
  urban_intersection: false
  citation: "INEGI (2025). Marco Geoestadístico 2025 - Baja California.  https://en.www.inegi.org.mx/app/biblioteca/ficha.html?upc=794551163061; CFC (2026) Condesa development boundaries."
  notes: Dissolved union of MX/INEGI/02_bajacalifornia.zip/conjunto_de_datos/02l.shp -where  "NOMGEO='Mexicali'" and convex hull of MX/CFC/Nvo desarrollo/_Fraccionamientos.geojson, so that the analysis covers 100% of the Condesa development.
exclusion_region:
  data: MX/exclusion/ca_state.zip
  source: https://data.ca.gov/dataset/e212e397-1277-4df3-8c22-40721b095f33/resource/3db1e426-fb51-44f5-82d5-a54d7c6e188b/download/ca_state.zip
  licence: public domain
  citation: California State boundary in shapefile format from the US Census Bureau's 2023 MAF/TIGER database.
  notes: Es necesario tener cuidado para garantizar que la zona de estudio delimitada no se extienda más allá de la frontera con Estados Unidos // Care must be taken to ensure the buffered study region does not expand across the border with the United States, so that road network and amenities outside Mexico are not included in accessibility calculations.  Per https://github.com/healthysustainablecities/global-indicators/issues/610 the network setup is restricted to the main study region (not the buffered region).
population:
  name: "Global Human Settlements population data: 2025, Mollweide (EU JRC, 2023)"
  data_dir: MX/CFC/GHS_POP_E2025_GLOBE_R2023A_54009_100_V1_0_R6_C8/
  data_type: raster:Int64
  ## Image resolution; also used to name the population grid and its
  ## indicator summary (population_100m_2025 / indicators_100m_2025)
  resolution: 100m
  raster_band: 1
  raster_nodata: -200
  pop_min_threshold: 1
  crs_name: Mollweide
  crs_standard: ESRI
  crs_srid: 54009
  source_url: "https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/GHSL/GHS_POP_GLOBE_R2023A/GHS_POP_E2025_GLOBE_R2023A_54009_100/V1-0/tiles/GHS_POP_E2025_GLOBE_R2023A_54009_100_V1_0_R6_C8.zip"
  year_published: 2023
  year_target: 2025
  date_acquired: 20260804
  licence: CC BY 4.0
  citation: "Schiavina, M., Freire, S., Carioli, A., MacManus, K. (2023). GHS-POP R2023A - GHS population grid multitemporal (1975-2030). European Commission, Joint Research Centre (JRC). https://doi.org/10.2905/2FF68A52-5B5B-4A22-8F40-C41DA8332CFE"
  notes: Population is NOT redirected to a custom aggregation; the 100 m grid derived from this raster is a required output scale.
sampling:
  ## Much of the Condesa development is platted but not yet occupied,
  ## and is not covered by 2020 census population.  Sample the full
  ## study region regardless of population coverage so that estimates
  ## are produced there.  Sample points without population coverage
  ## are excluded from population-weighted summaries but included in
  ## custom aggregations.
  sample_unpopulated_areas: true
  ## One additional sample point per Condesa lot, snapped to its
  ## nearest network edge (see MX/CFC/build_condesa_sample_points.py).
  ##
  ## Network sample points are placed at intervals along streets, so
  ## lots set back from a street fall outside the 30 m aggregation
  ## catchment and receive no values -- 3,299 of 14,989 lots on the
  ## first run.  Widening the catchment instead would be worse: many
  ## lots sit deep inside gated fraccionamientos with a single exit,
  ## so a sample point that is near in a straight line may lie beyond
  ## the gate and imply a much shorter route than a resident could
  ## take.  It would also average away the variation between lots that
  ## makes this development worth examining.
  ##
  ## The 100 m tolerance is deliberate rather than generous: lots
  ## further than this from a mapped street are in fraccionamientos
  ## whose internal streets are absent from OpenStreetMap, and
  ## snapping them hundreds of metres to an external road would
  ## fabricate access they do not have.  Those lots are better left
  ## without a value.
  custom_sample_points: MX/CFC/condesa_lot_sample_points.gpkg
  custom_sample_points_snap_tolerance: 100
custom_aggregations:
  ## Order matters: later entries may aggregate from earlier ones.
  agebs:
    data: MX/mexicali_AGEB_population.geojson
    id: CVEGEO
    keep_columns: AGEB, POBTOT
    ## AGEBs (median 36 ha) are much larger than a 100 m cell, so the
    ## grid aggregates into them cleanly, weighted by grid population.
    aggregation_source: grid
    weight: pop_est
    notes: INEGI 2020 AGEB boundaries with census population, as prepared in Mexicali_2025.ipynb.
  manzanas:
    data: MX/CFC/mexicali_manzanas.gpkg:manzanas
    id: CVEGEO
    keep_columns: CVE_AGEB, CVE_MZA, AMBITO, POBTOT, POB0_14, POB15_64, POB65_MAS, VIVTOT, TVIVHAB
    ## Manzanas (median 0.71 ha) are finer than a 100 m grid cell, so
    ## aggregating from the grid would just copy the containing cell.
    ## Sample points within 30 m give a finer result.
    aggregation_source: point
    aggregate_within_distance: 30
    weight: POBTOT
    notes: INEGI 2020 census manzanas with geometries updated by CFC (19,223 manzanas; 940,287 residents; 236.9 km2), prepared by MX/CFC/build_manzanas.py. Replaces MX/CFC/MXL_MZAPob.gpkg:02m, which covered the Condesa development only partially -- 6,274 of its 14,989 lots fell within a manzana, against 12,985 here. 3,497 manzanas have no recorded population (2,772 of them rural) and report a null pop_est rather than zero; they are excluded from population-weighted summaries. Sixteen newly mapped Condesa blocks had no manzana key and carry a synthetic identifier assigned by build_manzanas.py, recognisable by an 'S' where the manzana number would be.
  condesa_lotes:
    data: MX/CFC/Nvo desarrollo/Lotes_desarrollo_EXE_cleaned_400sqm_or_less.geojson
    keep_columns: ID
    aggregation_source: point
    aggregate_within_distance: 15
    weight: 3.2
    notes: 'Individual lots in the Condesa development (median 120 m2). No population data; however we can assign an assumed value, assuming average household population of 3.2 for Mexicali (2020; https://inegi.org.mx/app/areasgeograficas/?ag=02002#tabMCcollapse-Indicadores).  Note: this data appeared to include more than lots, larger block areas which appeared to be artifacts, so I filtered to those with area <= 400sqm (manually in QGIS).'
  condesa_fraccionamientos:
    data: MX/CFC/Nvo desarrollo/_Fraccionamientos.geojson
    keep_columns: FID
    aggregation_source: condesa_lotes
    weight: pop_est
    notes: Condesa subdivision polygons (median 7.9 ha). pop_est is summed from condesa_lotes (3.2 people per lot assumed).
  region_mexicali:
    data: MX/CFC/mexicali_uli_boundaries.gpkg:region_mexicali
    id: area_id
    keep_columns: area_name
    aggregation_source: grid
    weight: pop_est
    notes: The Mexicali urban area boundary, dissolved, giving a single summary row for the administrative area.
  region_condesa:
    data: MX/CFC/mexicali_uli_boundaries.gpkg:region_condesa
    id: area_id
    keep_columns: area_name
    aggregation_source: condesa_lotes
    weight: pop_est
    notes: The Condesa development, dissolved, giving a single summary row for the development as a whole.
## Custom public transport stops.  Mexicali has no GTFS feed, so the
## IMIP equipamiento layer is the local source for transit stops.
##
## 'replace' is left at its default (false), so these features are
## pooled with any identified from OpenStreetMap, matching the
## earlier Mexicali runs.  Set it to true to use IMIP alone, which
## would make the reported count of stops exact rather than double
## counting stops present in both sources.
points_of_interest:
  pt_any:
    data: MX/CFC/cleaned/por_estado/02_baja_california/002_mexicali/imip/equipamiento_combined.fgb -where "equipamiento_category='transp' AND TIPO != 'TERMINAL INTERIOR DE CARGA (CENTRAL DE SERVICIOS DE CARGA)'"
    source: IMIP / CFC
    publication_date: 2026-05-18
    url: ""
    licence: "Provided by IMIP via CFC"
    citation: As per advice from Juan Ernesto Díaz Noguez
  ##
  ## DENUE 2026 (INEGI) economic units, filtered to functional
  ## categories by SCIAN activity code.  The source is the whole of
  ## Baja California; each entry reads it with an OGR -where filter,
  ## and _05_compile_destinations additionally clips to the buffered
  ## study region, so the counts below (Mexicali municipality) are an
  ## upper bound on what lands in the analysis.
  ##
  ## Codes were derived from the dataset itself rather than from the
  ## DENUE-SCIAN worksheet, which supplies codes for only two of its
  ## eighteen functional categories.  Provenance is shared via a YAML
  ## anchor on the first entry.
  ##
  ## Fresh food retail: 1,103 establishments in Mexicali.
  ## Butchers, poulterers, fishmongers, greengrocers, grain and dairy
  ## retailers, supermarkets and minisupers -- the DENUE equivalent of
  ## GHSCI's 'fresh food market'.
  denue_fresh_food: &denue
    data: MX/INEGI/DENUE_2026/denue_inegi_02_.shp -where "codigo_act IN ('461121','461122','461123','461130','461140','461150','462111','462112')"
    dest_name_full: Fresh food retail (DENUE)
    domain: Daily essential services
    ## Retain each establishment's SCIAN activity code as a destination tag, so
    ## that a category imported once can be subdivided into its sub-types for
    ## the diversity measures below without declaring a separate entry for each.
    ## Shared by every DENUE category through this anchor.
    keep_columns: codigo_act
    source: INEGI, Directorio Estadistico Nacional de Unidades Economicas (DENUE)
    publication_date: 2026-05
    url: https://www.inegi.org.mx/app/mapa/denue/
    licence: Terminos de Libre Uso de la Informacion del INEGI
    citation: "INEGI (2026). Directorio Estadistico Nacional de Unidades Economicas (DENUE), mayo 2026. Instituto Nacional de Estadistica y Geografia, Mexico."
  ## Food retail, any: 4,225 establishments in Mexicali.
  ## All food retail including abarrotes / miscelaneas, confectionery and
  ## prepared foods, plus self-service and department stores. Alcohol and
  ## tobacco retail (461211-461220) are excluded.
  denue_food_retail:
    <<: *denue
    data: MX/INEGI/DENUE_2026/denue_inegi_02_.shp -where "(codigo_act LIKE '4611%' AND codigo_act NOT IN ('461211','461212','461213','461220')) OR codigo_act LIKE '4621%'"
    dest_name_full: Food retail, any (DENUE)
    domain: Daily essential services
  ## Bakeries and tortillerias: 607 establishments in Mexicali.
  ## Panificacion tradicional (217), tortillas de harina de trigo (139) and
  ## tortillas de maiz / molienda de nixtamal (251).  SCIAN classifies these as
  ## manufacturing (31) rather than retail, because the food is made where it is
  ## sold, so they fall outside every 46xx food category and were invisible to
  ## the food indicators -- even though the ULI sub-variable names bakeries and
  ## tortillerias as fresh food, and in Mexicali they are daily destinations.
  ## Industrial bakery (311811) and biscuit/pasta manufacture (311820) are
  ## excluded as they are not retail outlets.
  denue_bakery_tortilleria:
    <<: *denue
    data: MX/INEGI/DENUE_2026/denue_inegi_02_.shp -where "codigo_act IN ('311812','311813','311830')"
    dest_name_full: Bakeries and tortillerias (DENUE)
    domain: Daily essential services
  ## Basic household goods: 1,208 establishments in Mexicali.
  ## Stationery, disposables, furniture, appliances, kitchenware, hardware
  ## (ferreterias / tlapalerias) and cleaning products.
  denue_household_goods:
    <<: *denue
    data: MX/INEGI/DENUE_2026/denue_inegi_02_.shp -where "codigo_act IN ('465311','465914','466111','466112','466114','467111','467115')"
    dest_name_full: Basic household goods (DENUE)
    domain: Daily essential services
  ## Pharmacies and medicine retail: 689 establishments in Mexicali.
  ## Pharmacies with and without a minisuper, and naturopathic /
  ## homeopathic medicine retailers.
  denue_pharmacy:
    <<: *denue
    data: MX/INEGI/DENUE_2026/denue_inegi_02_.shp -where "codigo_act IN ('464111','464112','464113')"
    dest_name_full: Pharmacies and medicine retail (DENUE)
    domain: Daily essential services
  ## Financial and postal services: 369 establishments in Mexicali.
  ## Retail banking, development banking, savings cooperatives, currency
  ## exchange and postal services. Listed as optional in the ULI
  ## sub-variable table.
  denue_finance_comms:
    <<: *denue
    data: MX/INEGI/DENUE_2026/denue_inegi_02_.shp -where "codigo_act IN ('522110','522210','522320','523122','491110')"
    dest_name_full: Financial and postal services (DENUE)
    domain: Daily essential services
  ## Preschools: 334 establishments in Mexicali.
  denue_preschool:
    <<: *denue
    data: MX/INEGI/DENUE_2026/denue_inegi_02_.shp -where "codigo_act IN ('611111','611112','611171','611172')"
    dest_name_full: Preschools (DENUE)
    domain: Health, education and care
  ## Primary schools: 376 establishments in Mexicali.
  ## Schools combining several levels (611171 / 611172) are counted in
  ## each level they serve, so they appear here and in the preschool and
  ## secondary categories.
  denue_primary_school:
    <<: *denue
    data: MX/INEGI/DENUE_2026/denue_inegi_02_.shp -where "codigo_act IN ('611121','611122','611171','611172')"
    dest_name_full: Primary schools (DENUE)
    domain: Health, education and care
  ## Secondary and upper secondary schools: 237 establishments in Mexicali.
  ## General, technical and upper secondary (media superior) schools.
  denue_secondary_school:
    <<: *denue
    data: MX/INEGI/DENUE_2026/denue_inegi_02_.shp -where "codigo_act IN ('611131','611132','611142','611151','611152','611161','611162','611171','611172')"
    dest_name_full: Secondary and upper secondary schools (DENUE)
    domain: Health, education and care
  ## Tertiary and vocational education: 155 establishments in Mexicali.
  ## Higher technical and university education, commercial and secretarial
  ## schools, and trades training.
  denue_tertiary_education:
    <<: *denue
    data: MX/INEGI/DENUE_2026/denue_inegi_02_.shp -where "codigo_act LIKE '6112%' OR codigo_act LIKE '6113%' OR codigo_act IN ('611411','611412','611511','611512')"
    dest_name_full: Tertiary and vocational education (DENUE)
    domain: Health, education and care
  ## Primary healthcare: 397 establishments in Mexicali.
  ## General medical consulting rooms and clinics of consulting rooms,
  ## public and private. Note the ULI worksheet gives 6221 for this row,
  ## but 6221 is general hospitals.
  denue_primary_healthcare:
    <<: *denue
    data: MX/INEGI/DENUE_2026/denue_inegi_02_.shp -where "codigo_act IN ('621111','621112','621115','621116')"
    dest_name_full: Primary healthcare (DENUE)
    domain: Health, education and care
  ## Specialist and diagnostic clinics: 1,603 establishments in Mexicali.
  ## Specialist medical and dental consulting rooms and medical /
  ## diagnostic laboratories.
  denue_medical_clinic:
    <<: *denue
    data: MX/INEGI/DENUE_2026/denue_inegi_02_.shp -where "codigo_act IN ('621113','621211','621212','621511')"
    dest_name_full: Specialist and diagnostic clinics (DENUE)
    domain: Health, education and care
  ## Hospitals: 70 establishments in Mexicali.
  ## General, psychiatric and other specialist hospitals, public and
  ## private.
  denue_hospital:
    <<: *denue
    data: MX/INEGI/DENUE_2026/denue_inegi_02_.shp -where "codigo_act LIKE '622%'"
    dest_name_full: Hospitals (DENUE)
    domain: Health, education and care
  ## Care and social support services: 320 establishments in Mexicali.
  ## Residential care, social work and orientation services, community
  ## food and shelter services, and childcare.
  denue_care_support:
    <<: *denue
    data: MX/INEGI/DENUE_2026/denue_inegi_02_.shp -where "codigo_act LIKE '623%' OR codigo_act LIKE '624%'"
    dest_name_full: Care and social support services (DENUE)
    domain: Health, education and care
  ## Childcare: 81 establishments in Mexicali.
  ## Guarderias, public and private; a subset of the care and social
  ## support category above, reported separately because access to
  ## childcare is asked for in its own right.
  denue_childcare:
    <<: *denue
    data: MX/INEGI/DENUE_2026/denue_inegi_02_.shp -where "codigo_act IN ('624411','624412')"
    dest_name_full: Childcare (DENUE)
    domain: Health, education and care
  ## Community and social facilities: 1,119 establishments in Mexicali.
  ## Religious and civil associations, and public social welfare
  ## administration.
  denue_community:
    <<: *denue
    data: MX/INEGI/DENUE_2026/denue_inegi_02_.shp -where "codigo_act IN ('813210','813230','931610')"
    dest_name_full: Community and social facilities (DENUE)
    domain: Community, culture and recreation
  ## Cultural facilities: 61 establishments in Mexicali.
  ## Museums, libraries and archives, cinemas, and venues promoting
  ## artistic and cultural events.
  denue_culture:
    <<: *denue
    data: MX/INEGI/DENUE_2026/denue_inegi_02_.shp -where "codigo_act IN ('712111','712112','519211','519212','512130','711311','711312')"
    dest_name_full: Cultural facilities (DENUE)
    domain: Community, culture and recreation
  ## Sports and active recreation: 317 establishments in Mexicali.
  ## Sports clubs, fitness centres, golf courses, bowling alleys and
  ## sports schools, public and private.
  denue_sport:
    <<: *denue
    data: MX/INEGI/DENUE_2026/denue_inegi_02_.shp -where "codigo_act IN ('713941','713942','713943','713944','713910','713950','611621','611622')"
    dest_name_full: Sports and active recreation (DENUE)
    domain: Community, culture and recreation
  ## Public recreation venues: 29 establishments in Mexicali.
  ## Amusement and water parks, botanic gardens and zoos. Public open
  ## space itself is derived from OpenStreetMap (the aos_* layers); this
  ## complements rather than replaces it.
  denue_recreation:
    <<: *denue
    data: MX/INEGI/DENUE_2026/denue_inegi_02_.shp -where "codigo_act IN ('713111','713112','713113','712131','712132')"
    dest_name_full: Public recreation venues (DENUE)
    domain: Community, culture and recreation
  ## Any economic establishment: 38,385 establishments in Mexicali.
  ## Every DENUE establishment, unfiltered. With ~38,000 points in
  ## Mexicali, access to this is close to universal and so carries little
  ## information; denue_employer_medium is the more discriminating
  ## employment destination. Both are configured so the choice can be made
  ## on the evidence.
  denue_employment_any:
    <<: *denue
    data: MX/INEGI/DENUE_2026/denue_inegi_02_.shp
    dest_name_full: Any economic establishment (DENUE)
    domain: Employment
  ## Employers of 11 or more people: 4,305 establishments in Mexicali.
  ## DENUE records employment as a size band rather than a count, so this
  ## filters on the band. Gravity-weighted reachable jobs (ULI
  ## sub-variable 112) needs establishment-level job counts and a decay
  ## model, and is not attempted here.
  denue_employer_medium:
    <<: *denue
    data: MX/INEGI/DENUE_2026/denue_inegi_02_.shp -where "per_ocu NOT IN ('0 a 5 personas','6 a 10 personas')"
    dest_name_full: Employers of 11 or more people (DENUE)
    domain: Employment
  ## Manufacturing and industrial establishments: 2,581 establishments in Mexicali.
  denue_manufacturing:
    <<: *denue
    data: MX/INEGI/DENUE_2026/denue_inegi_02_.shp -where "codigo_act LIKE '31%' OR codigo_act LIKE '32%' OR codigo_act LIKE '33%'"
    dest_name_full: Manufacturing and industrial establishments (DENUE)
    domain: Employment
  ## Petrol stations: 232 establishments in Mexicali.
  ## Reported for distance rather than access: proximity to a petrol
  ## station is a disamenity (the ULI table cites evidence of increased
  ## relative risk of childhood leukaemia within 250 m), so read
  ## avg_walk_dist_denue_petrol_station as "higher is better".
  denue_petrol_station:
    <<: *denue
    data: MX/INEGI/DENUE_2026/denue_inegi_02_.shp -where "codigo_act IN ('468411','468413')"
    dest_name_full: Petrol stations (DENUE)
    domain: Daily essential services
OpenStreetMap:
  ## Latest Geofabrik Mexico extract, which includes the streets contributed
  ## to OpenStreetMap for the Condesa development.  The earlier
  ## mexico-260409.osm.pbf predates those edits and mapped Condesa's internal
  ## network only partially, which suppressed access estimates there.
  ##
  ## Those streets were mapped at 04:43 UTC on 15 August 2026.  The extract
  ## holds edits to 20:21 UTC that day (its replication timestamp), but the
  ## routable network, retrieved from Overpass, was until 26 September 2026
  ## pinned to the start of the publication date and so omitted them (26
  ## streets, leaving about 1,200 lots without estimates).  _03 now takes the
  ## Overpass date from the extract's replication timestamp.
  data_dir: MX/mexico-260815.osm.pbf
  source: Geofabrik GmbH
  publication_date: 20260815
  licence: ODbL
  url: https://download.geofabrik.de/north-america/mexico-latest.osm.pbf
  note: Mexico OpenStreetMap excerpt
network:
  ## Custom pedestrian definition retaining private/gated access.  The
  ## default excludes ["service"!~"private"]["access"!~"private"],
  ## which would omit the internal streets of the Condesa development
  ## and of Mexicali's gated communities -- precisely the areas of
  ## interest here.
  pedestrian: |
      ["highway"]
      ["area"!~"yes"]
      ["highway"!~"motorway|proposed|construction|abandoned|platform|raceway|emergency_bay"]
      ["service"!~"slipway|emergency_access|parking_aisle|driveway|drive-through"]
      ["access"!~"no|forestry|emergency|delivery|agricultural|customers|military|permit|unknown"]
  ## Retain gated communities
  osmnx_retain_all: true
  ## Network extraction restricted to the study region, not the
  ## buffered region, to avoid crossing the US border (issue #610)
  buffered_region: true
## Shared accessibility specification (destinations, activity centres and
## combined-access sets).  Declared under 'pedestrian' rather than at the
## top level so that the cycling analysis keeps its globally comparable
## default destinations; walking additionally measures the DENUE-derived
## local set below.
##
## Walking access is judged at 300 m -- the five minute walk -- rather than
## the 500 m used by the globally comparable core indicators.  In an arid city
## where summer maxima exceed 45 °C, the distance people will walk is shorter,
## and 300 m is also the distance Mexicali's own collector-road walkability
## policy targets.  The core pct_access_500m_* indicators are still produced
## unchanged, so that Mexicali remains comparable with other cities.
##
## Bands of 300 / 500 / 1000 / 1500 m are used rather than the single 300 m
## threshold because the distance to the nearest destination is censored at
## the largest band: a mean distance computed from 300 m-censored values would
## be a mean among those who already have access, biased hardest exactly
## where access is worst.  The 500 m band is the conventional walkable
## neighbourhood, so that each indicator can also be read at the distance
## used elsewhere (and the dashboard shows access across all four bands).  The
## 1000 m band is retained for employment, which is judged at a longer
## distance, and censoring at 1500 m keeps distances informative out to five
## times the access threshold, which the soft thresholds of the composite
## index below rely on.
##
## Outputs (in addition to, not instead of, the standard indicators.yml
## walking indicators, which are unchanged):
##   sample point   sp_walk_access_<name>_<d>m, sp_walk_nearest_node_<name>
##   grid / areas   pct_access_walk_<name>_<d>m, avg_walk_dist_<name>
##   city           pop_ prefixed, population weighted
accessibility:
  pedestrian:
    distances: [300, 500, 1000, 1500]
    destinations:
    ## The global defaults, retained so that walking access and mean
    ## walking distance are also reported for the comparable categories
    ## and for the standard 400 m activity centre.
    - {name: fresh_food_market,       category: food, variant: strict,  layer: destinations, where: "dest_name = 'fresh_food_market'"}
    - {name: fresh_food_pooled,       category: food, variant: lenient, layer: destinations, where: "dest_name IN ('fresh_food_market', 'convenience')"}
    ## Convenience stores alone: one of the three daily living destinations
    ## of the walkability index, which walkability_variants below judges at
    ## 300 and 500 m (the GHSCI index itself judges it at 500 m only).
    - {name: convenience,             category: convenience, variant: any, layer: destinations, where: "dest_name = 'convenience'"}
    - {name: public_open_space_large, category: pos,  variant: strict,  layer: aos_public_large_nodes_30m_line}
    - {name: public_open_space_any,   category: pos,  variant: lenient, layer: aos_public_any_nodes_30m_line}
    ## Blue space (ULI core measure 8, "Available natural blue spaces").  Two
    ## separately named indicators rather than strict / lenient variants of one
    ## category: reaching water and reaching a park that contains water are
    ## different things, and neither is a stricter reading of the other.
    ##
    ## 'blue_space' is derived independently of the open space pipeline, from
    ## water tags on both OpenStreetMap polygons and lines.  That matters here:
    ## Mexicali's canals and drains are largely mapped as ways, which never enter
    ## the polygon-based open space pipeline at all, and water is in any case
    ## excluded from public open space so that a canal cannot chain contiguous
    ## parks into one enormous area of open space.  Both rules are right for
    ## parks and both would hide the canal network, so blue space is measured
    ## separately rather than by relaxing them.
    - {name: blue_space, category: blue_space, variant: any, layer: blue_space_nodes_30m_line}
    - {name: public_open_space_with_water, category: public_open_space_with_water, variant: any, layer: aos_public_water_nodes_30m_line}
    - {name: pt_frequent,             category: pt,   variant: strict,  layer: pt_stops_headway, where: "headway <= 20"}
    - {name: pt_any,                  category: pt,   variant: lenient, layer: destinations, where: "dest_name = 'pt_any'"}
    ## Mexicali's DENUE-derived functional categories (see
    ## points_of_interest above for the SCIAN codes behind each).
    - {name: denue_fresh_food, category: food_retail, variant: strict, layer: destinations, where: "dest_name = 'denue_fresh_food'"}
    - {name: denue_food_retail, category: food_retail, variant: lenient, layer: destinations, where: "dest_name = 'denue_food_retail'"}
    - {name: denue_bakery_tortilleria, category: bakery_tortilleria, variant: any, layer: destinations, where: "dest_name = 'denue_bakery_tortilleria'"}
    - {name: denue_household_goods, category: household_goods, variant: any, layer: destinations, where: "dest_name = 'denue_household_goods'"}
    - {name: denue_pharmacy, category: pharmacy, variant: any, layer: destinations, where: "dest_name = 'denue_pharmacy'"}
    - {name: denue_finance_comms, category: finance_comms, variant: any, layer: destinations, where: "dest_name = 'denue_finance_comms'"}
    - {name: denue_preschool, category: preschool, variant: any, layer: destinations, where: "dest_name = 'denue_preschool'"}
    - {name: denue_primary_school, category: primary_school, variant: any, layer: destinations, where: "dest_name = 'denue_primary_school'"}
    - {name: denue_secondary_school, category: secondary_school, variant: any, layer: destinations, where: "dest_name = 'denue_secondary_school'"}
    - {name: denue_tertiary_education, category: tertiary_education, variant: any, layer: destinations, where: "dest_name = 'denue_tertiary_education'"}
    - {name: denue_primary_healthcare, category: healthcare, variant: any, layer: destinations, where: "dest_name = 'denue_primary_healthcare'"}
    - {name: denue_medical_clinic, category: clinic, variant: any, layer: destinations, where: "dest_name = 'denue_medical_clinic'"}
    - {name: denue_hospital, category: hospital, variant: any, layer: destinations, where: "dest_name = 'denue_hospital'"}
    - {name: denue_care_support, category: care, variant: any, layer: destinations, where: "dest_name = 'denue_care_support'"}
    - {name: denue_childcare, category: childcare, variant: any, layer: destinations, where: "dest_name = 'denue_childcare'"}
    - {name: denue_community, category: community, variant: any, layer: destinations, where: "dest_name = 'denue_community'"}
    - {name: denue_culture, category: culture, variant: any, layer: destinations, where: "dest_name = 'denue_culture'"}
    - {name: denue_sport, category: sport, variant: any, layer: destinations, where: "dest_name = 'denue_sport'"}
    - {name: denue_recreation, category: recreation, variant: any, layer: destinations, where: "dest_name = 'denue_recreation'"}
    ## Any community, cultural, sport or recreation establishment: the ULI
    ## sub-variable "Access to community, culture and recreation services" is
    ## one measure across the four, whose diversity is measured separately.
    - {name: denue_ccr_any, category: community_culture_recreation, variant: any, layer: destinations, where: "dest_name IN ('denue_community', 'denue_culture', 'denue_sport', 'denue_recreation')"}
    ## The three Employment functional categories are recorded separately
    ## rather than pooled as strict / lenient variants of one category: any
    ## establishment, employers of 11 or more, and manufacturing answer
    ## different questions and are reported in their own right.
    - {name: denue_employment_any, category: employment_any, variant: any, layer: destinations, where: "dest_name = 'denue_employment_any'"}
    - {name: denue_employer_medium, category: employer_medium, variant: any, layer: destinations, where: "dest_name = 'denue_employer_medium'"}
    - {name: denue_manufacturing, category: manufacturing, variant: any, layer: destinations, where: "dest_name = 'denue_manufacturing'"}
    ## Petrol stations are a disamenity: the ULI sub-variable is the share of
    ## the population living 250 m or more from one, citing evidence of
    ## increased relative risk of childhood leukaemia within that distance.
    ## 'direction: avoid' evaluates the threshold with that polarity --
    ## pct_beyond_walk_denue_petrol_station_250m, higher is better -- which is
    ## the spec-level counterpart of the greater_than_or_equal_to sample point
    ## analyses in indicators.yml.  The 250 m band applies to this destination
    ## alone; the mean distance is reported over the full 1500 m band as usual.
    - {name: denue_petrol_station, category: petrol_station, variant: any, layer: destinations, where: "dest_name = 'denue_petrol_station'", distances: [250], direction: avoid}
    ## Activity centres at the 300 m (five minute) walk the Mexicali
    ## collector-road walkability policy targets, one per DENUE-SCIAN
    ## group, plus a cross-group 'services' definition expressing the
    ## policy's own wording -- a concentration of services within a five
    ## minute walk.
    ##
    ## Tiers map a tier name to the destination variant it is built from.
    ## Categories with a single 'any' variant resolve to their sole spec,
    ## so a one-tier definition suffices for them.
    activity_centres:
      ## The global 400 m definition is switched off: the policy question
      ## here is the 300 m one, and carrying both would double the
      ## activity-centre variables to no purpose.
      standard: false
      essentials:
        walk_threshold: 300
        categories: [food_retail, household_goods, pharmacy]
        tiers: {local: lenient, complete: strict}
      health:
        walk_threshold: 300
        categories: [healthcare, primary_school, care]
        tiers: {all: any}
      civic:
        walk_threshold: 300
        categories: [community, culture, sport]
        tiers: {all: any}
      ## The Employment group contains only employment categories, so a
      ## centre built from it alone would reduce to the employment
      ## destination itself.  It is defined here as a mixed-use
      ## employment centre instead: work co-located with daily food
      ## retail and public transport.
      jobs:
        walk_threshold: 300
        categories: [employer_medium, food_retail, pt]
        tiers: {local: lenient, complete: strict}
      ## The policy indicator: a concentration of services across groups.
      services:
        walk_threshold: 300
        categories: [food_retail, pharmacy, healthcare, primary_school, community]
        tiers: {local: lenient, complete: strict}
    ## Diversity of what is reachable (ULI sub-variables 39, 46, 48 and 52,
    ## "Diversity of available ..."), as distinct from whether anything is
    ## reachable at all.  Somewhere with five minisupers and somewhere with a
    ## butcher, a greengrocer, a dairy and a supermarket have identical access
    ## to fresh food, and should not have identical diversity of it.
    ##
    ## Each set reports, per band: a count per sub-type
    ## (avg_count_walk_<set>__<sub-type>_<d>m), the normalised Shannon entropy
    ## of those counts (avg_diversity_walk_<set>_<d>m, 0-1) and the share of
    ## sub-types with anything reachable (avg_richness_walk_<set>_<d>m, 0-1).
    ##
    ## The number of sub-types is fixed here rather than by what happens to be
    ## present locally, so the scores are comparable between areas.  Sub-types
    ## are drawn from the DENUE-SCIAN worksheet's functional categories, and
    ## every code below was confirmed present in the Mexicali extract.
    ##
    ## Bands follow the walking bands (300 / 500 / 1000 / 1500 m), so that every
    ## pedestrian measure can be read at the same four distances.  The ULI
    ## judges diversity at 500 m: at 300 m most points reach one sub-type or
    ## none, which says little about diversity, and 1500 m is the censoring
    ## distance rather than a walk anyone is assumed to make.
    diversity:
      ## Sub-types within one imported category, separated by activity code
      ## (hence keep_columns: codigo_act above), plus bakeries and tortillerias,
      ## which SCIAN classifies as manufacturing and which are therefore a
      ## separate category rather than a code subset.
      fresh_food:
        distances: [300, 500, 1000, 1500]
        groups:
          meat: "dest_name = 'denue_fresh_food' AND tags->>'codigo_act' IN ('461121','461122','461123')"
          produce: "dest_name = 'denue_fresh_food' AND tags->>'codigo_act' = '461130'"
          grains_and_spices: "dest_name = 'denue_fresh_food' AND tags->>'codigo_act' = '461140'"
          dairy: "dest_name = 'denue_fresh_food' AND tags->>'codigo_act' = '461150'"
          supermarket: "dest_name = 'denue_fresh_food' AND tags->>'codigo_act' = '462111'"
          minisuper: "dest_name = 'denue_fresh_food' AND tags->>'codigo_act' = '462112'"
          bakery_tortilleria: "dest_name = 'denue_bakery_tortilleria'"
      ## Sub-types that are already separate imported categories, so no code
      ## filtering is needed.  A school combining several levels (611171 /
      ## 611172) is imported under each level it serves and so counts towards
      ## each, which is the intended reading: a school serving that level is
      ## available.
      education:
        distances: [300, 500, 1000, 1500]
        groups:
          preschool: "dest_name = 'denue_preschool'"
          primary: "dest_name = 'denue_primary_school'"
          secondary: "dest_name = 'denue_secondary_school'"
          tertiary: "dest_name = 'denue_tertiary_education'"
      ## denue_childcare is a subset of denue_care_support, so only the broader
      ## category is used here; counting both would count a creche twice and
      ## overstate the evenness of what is available.
      health_care:
        distances: [300, 500, 1000, 1500]
        groups:
          primary_healthcare: "dest_name = 'denue_primary_healthcare'"
          specialist_clinic: "dest_name = 'denue_medical_clinic'"
          hospital: "dest_name = 'denue_hospital'"
          pharmacy: "dest_name = 'denue_pharmacy'"
          care_support: "dest_name = 'denue_care_support'"
      ## Diversity of care services (ULI sub-variable "Diversity of care
      ## services"): the SCIAN groups within care and social support.
      ## Childcare is taken from the care category by code, not from
      ## denue_childcare, so that no establishment is counted twice.
      care:
        distances: [300, 500, 1000, 1500]
        groups:
          childcare: "dest_name = 'denue_care_support' AND tags->>'codigo_act' IN ('624411','624412')"
          residential_care: "dest_name = 'denue_care_support' AND tags->>'codigo_act' LIKE '623%'"
          social_assistance: "dest_name = 'denue_care_support' AND tags->>'codigo_act' LIKE '624%' AND tags->>'codigo_act' NOT IN ('624411','624412')"
      community_culture_rec:
        distances: [300, 500, 1000, 1500]
        groups:
          community: "dest_name = 'denue_community'"
          culture: "dest_name = 'denue_culture'"
          sport: "dest_name = 'denue_sport'"
          recreation: "dest_name = 'denue_recreation'"
    combined_access:
      ## 'All categories reachable from home', as distinct from the
      ## activity centres above ('all categories co-located with each
      ## other').  The bare all_strict / all_lenient composite is pinned
      ## to the global trio; without this it would widen to every
      ## category having strict and lenient variants, including the
      ## DENUE ones, and stop meaning what its name says.
      standard: {categories: [food, pos, pt]}
      essentials: {categories: [food_retail, household_goods, pharmacy]}
      services: {categories: [food_retail, pharmacy, healthcare, primary_school, community]}
  ## Straight-line catchments for emergency services (ULI sub-variables 174,
  ## police station, and 69, fire station), from the IMIP equipamiento layer.
  ## These services are provided across catchments far larger than a walk,
  ## and an emergency response does not follow footpaths, so coverage is
  ## measured as the straight-line distance to the nearest station rather
  ## than along the pedestrian network.  The distances are provisional,
  ## pending evidence for an appropriate response distance.
  ##
  ## Outputs: sp_euclid_dist_<name> and sp_euclid_access_<name>_<d>m at
  ## sample points, aggregated to pct_access_euclid_<name>_<d>m and
  ## avg_euclid_dist_<name> (pop_ prefixed for population weighted values).
  ##
  ## A 75 km fire station catchment reaches every location in the study
  ## region, so it reports universal coverage: it is recorded for
  ## completeness, and is not used in the composite index below, which would
  ## leave out an indicator that does not vary in any case.  The police
  ## station distance is measured out to 45 km (max_distance), three times
  ## its 15 km threshold, so that the composite index can use it through a
  ## soft threshold.
  euclidean:
    destinations:
      - name: imip_police_station
        dest_name_full: Police stations (IMIP)
        data: MX/CFC/cleaned/por_estado/02_baja_california/002_mexicali/imip/equipamiento_combined.fgb -where "TIPO = 'INSTALACIONES POLICIALES'"
        distances: [15000]
        max_distance: 45000
        source: IMIP / CFC
        licence: Provided by IMIP via CFC
        notes: 27 police facilities in the IMIP equipamiento layer (administración pública).
      - name: imip_fire_station
        dest_name_full: Municipal fire stations (IMIP)
        data: MX/CFC/cleaned/por_estado/02_baja_california/002_mexicali/imip/equipamiento_combined.fgb -where "TIPO = 'ESTACION DE BOMBEROS MUNICIPAL'"
        distances: [75000]
        source: IMIP / CFC
        licence: Provided by IMIP via CFC
        notes: 10 municipal fire stations in the IMIP equipamiento layer (administración pública).
