        group: {es: 'Acceso a parques', en: 'Access to parks'}
        label: {es: 'Parques a menos de 300 m', en: 'Parks within 300 m'}
        reading: {es: '{access} de la población vive a menos de 300 m de un parque o espacio público abierto; en promedio, el más cercano está a {value}', en: '{access} of the population live within 300 m of a park or public open space; on average the nearest is {value} away'}
        subdomain:
          ambient_environment: {es: 'Medioambiente', en: 'Ambient'}
          built_environment: {es: 'Infraestructura verde y azul', en: 'Green and blue infrastructure'}
        about:
          es: Distancia a pie al espacio público abierto más cercano, puntuada con un umbral suave de 300 m.
          en: Walking distance to the nearest public open space, scored with a 300 m soft threshold.
        sources:
          - 'OpenStreetMap contributors (Geofabrik Mexico extract, 15 August 2026); public open space identified by GHSCI.'
      - variable: sp_access_large_public_green_space_score
        name: lpugs
        domains: [ambient_environment, built_environment]
        lens: accessibility
        group: {es: 'Accesibilidad a grandes espacios públicos abiertos', en: 'Large public open space accessibility'}
        label: {es: 'Gran espacio verde público a menos de 500 m', en: 'Large public green space within 500 m'}
        reading: {es: '{value} de la población vive a menos de 500 m de un gran espacio verde público', en: '{value} of the population live within 500 m of a large public green space'}
        subdomain:
          ambient_environment: {es: 'Medioambiente', en: 'Ambient'}
          built_environment: {es: 'Infraestructura verde y azul', en: 'Green and blue infrastructure'}
        about:
          es: Acceso a pie, a 500 m, a un espacio verde público grande.
          en: Walking access within 500 m to a large public green space.
        sources:
          - 'GHSCI large public urban green space indicator (Google Earth Engine), with OpenStreetMap public open space.'
      ## -- Ambient environment and safety -------------------------------------
      - variable: sp_ext_major_road_length_300m
        name: major_roads
        domains: [ambient_environment, safety]
        polarity: negative
        lens: proximity
        group: {es: 'Proximidad a altos niveles de tráfico', en: 'Proximity to high levels of traffic'}
        label: {es: 'Proximidad a vialidades principales', en: 'Proximity to major roads'}
        reading: {es: 'En promedio, {value} de vialidades principales a 300 m', en: 'On average, {value} of major roads within 300 m'}
        subdomain:
          ambient_environment: {es: 'Medioambiente', en: 'Ambient'}
          safety: {es: 'Seguridad vial', en: 'Road safety'}
        about:
          es: Longitud de vialidades principales a 300 m, una aproximación a la exposición al ruido, la contaminación y el riesgo del tráfico; menor es mejor.
          en: Length of major roads within 300 m, a proxy for exposure to traffic noise, pollution and danger; lower is better.
        sources:
          - 'Mexicali ULI work packages (final_indicators.gpkg, 22 September 2026).'
      ## -- Built environment, mobility and social infrastructure -------------
      ## The walkability core measure (the sheet's starred row); attenuated by
      ## thermal comfort by default, and replaced by walkability alone in the
      ## 'plain' variant (see 'variants').  Its components in the sheet (net
      ## residential density, commercial land use, land use mix) are not
      ## scored separately.
      - variable: sp_walk_idx_300_tm
        name: walkability
        domains: [built_environment, mobility_transport, social_infrastructure]
        polarity: positive
        lens: accessibility
        group: {es: 'Índice de caminabilidad', en: 'Walkability index'}
        label: {es: 'Caminabilidad (300 m), atenuada por confort térmico', en: 'Walkability (300 m), attenuated by thermal comfort'}
        reading: {es: 'Puntuación media de caminabilidad de {value} (mayor es más caminable)', en: 'Average walkability score of {value} (higher is more walkable)'}
        subdomain:
          built_environment: {es: 'Diseño urbano', en: 'Urban design'}
          mobility_transport: {es: 'Movilidad activa', en: 'Active mobility'}
          social_infrastructure: {es: 'Servicios públicos', en: 'Public services'}
        about:
          es: Suma de puntuaciones z del acceso a mercado de alimentos frescos, tienda de conveniencia y transporte público a 300 m, la densidad de población y la densidad de intersecciones. Por defecto, su rango percentil se atenúa según el confort térmico diurno, hasta la mitad en los lugares más calurosos.
          en: Sum of z-scores of access to a fresh food market, convenience store and public transport within 300 m, population density and intersection density. By default its percentile rank is attenuated by daytime thermal comfort, by up to half at the hottest locations.
        sources:
          - 'Frank, L. D. et al. (2010) The development of a walkability index. British Journal of Sports Medicine 44, 924-933.'
          - 'OpenStreetMap contributors (Geofabrik Mexico extract, 15 August 2026); INEGI DENUE (May 2026); IMIP / CFC public transport stops; GHS-POP R2023A.'
          - 'Thermal comfort: Rossano Schifanella (WP02), SOLWEIG modelled UTCI for 21 July 2023 (Bröde et al. 2012).'
      ## -- Built environment, mobility and safety ----------------------------
      ## Smaller blocks are more walkable and slow traffic; the sheet notes its
      ## importance for Condesa's gated fraccionamientos.
      - variable: sp_ext_block_perimeter_m
        name: block_size
        domains: [built_environment, mobility_transport, safety]
        polarity: negative
        lens: presence
        group: {es: 'Presencia de infraestructura peatonal', en: 'Pedestrian infrastructure presence'}
        label: {es: 'Tamaño de manzana (perímetro)', en: 'Block size (perimeter)'}
        reading: {es: 'Las manzanas miden en promedio {value} de perímetro', en: 'Blocks average {value} in perimeter'}
        subdomain:
          built_environment: {es: 'Morfología urbana', en: 'Urban morphology'}
          mobility_transport: {es: 'Movilidad activa', en: 'Active mobility'}
          safety: {es: 'Seguridad vial', en: 'Road safety'}
        about:
          es: Perímetro medio de manzana (m); las manzanas más pequeñas son más caminables; menor es mejor.
          en: Mean block perimeter (m); smaller blocks are more walkable; lower is better.
        sources:
          - 'Mexicali ULI work packages (final_indicators.gpkg, 22 September 2026).'
      ## Police and fire stations: the work package's revised thresholds, as
      ## soft thresholds on straight-line distance (accessibility.euclidean).
      - variable: sp_euclid_dist_imip_police_station
        name: police_2km
        domains: [safety, mobility_transport, built_environment]
        transform: {soft_threshold: 2000}
        group: {es: 'Seguridad personal y vial', en: 'Personal and road safety'}
        label: {es: 'Estación de policía a menos de 2 km', en: 'Police station within 2 km'}
        reading: {es: 'En promedio, la estación de policía más cercana está a {value} en línea recta', en: 'On average the nearest police station is {value} away in a straight line'}
        subdomain:
          safety: {es: 'Seguridad personal', en: 'Personal safety'}
        about:
          es: Distancia en línea recta a la instalación policial más cercana, puntuada con un umbral suave de 2 km.
          en: Straight-line distance to the nearest police facility, scored with a 2 km soft threshold.
        sources:
          - 'IMIP equipamiento layer via CFC (27 police facilities); threshold revised by the work package (Alejandro).'
      - variable: sp_euclid_dist_imip_fire_station
        name: fire_3km
        domains: [safety, mobility_transport, built_environment]
        transform: {soft_threshold: 3000}
        group: {es: 'Seguridad personal y vial', en: 'Personal and road safety'}
        label: {es: 'Estación de bomberos a menos de 3 km', en: 'Fire station within 3 km'}
        reading: {es: 'En promedio, la estación de bomberos más cercana está a {value} en línea recta', en: 'On average the nearest fire station is {value} away in a straight line'}
        subdomain:
          safety: {es: 'Riesgos', en: 'Risks'}
        about:
          es: Distancia en línea recta a la estación de bomberos municipal más cercana, puntuada con un umbral suave de 3 km (NFPA 1710, unos cuatro minutos a 45 km/h).
          en: Straight-line distance to the nearest municipal fire station, scored with a 3 km soft threshold (NFPA 1710, about four minutes at 45 km/h).
        sources:
          - 'IMIP equipamiento layer via CFC (10 municipal fire stations); threshold revised by the work package (Alejandro).'
      ## Level of traffic stress: distance to the nearest fresh food or
      ## convenience store by the low stress (LTS 1-2) cycling network, which
      ## is searched well beyond this threshold.
      - variable: sp_cycle_safe_nearest_node_fresh_food_pooled
        name: cycle_low_stress_food
        domains: [safety, mobility_transport, built_environment]
        transform: {soft_threshold: 1500}
        group: {es: 'Nivel de estrés del tráfico para ciclismo', en: 'Level of traffic stress for cycling'}
        label: {es: 'Alimentos a menos de 1.5 km en bicicleta de bajo estrés', en: 'Food within 1.5 km by low-stress cycling'}
        reading: {es: 'En promedio, la tienda de alimentos más cercana está a {value} por calles de bajo estrés', en: 'On average the nearest fresh food or convenience store is {value} away by low-stress streets'}
        subdomain:
          safety: {es: 'Seguridad vial', en: 'Road safety'}
          mobility_transport: {es: 'Movilidad activa', en: 'Active mobility'}
          built_environment: {es: 'Diseño urbano', en: 'Urban design'}
        about:
          es: Distancia a la tienda de alimentos frescos o de conveniencia más cercana usando solo calles de bajo estrés para bicicleta (LTS 1-2), puntuada con un umbral suave de 1.5 km.
          en: Distance to the nearest fresh food or convenience store using only low-stress cycling streets (LTS 1-2), scored with a 1.5 km soft threshold.
        sources:
          - 'OpenStreetMap contributors (Geofabrik Mexico extract, 15 August 2026); level of traffic stress classified by GHSCI.'
          - 'INEGI (2026) Directorio Estadístico Nacional de Unidades Económicas (DENUE), May 2026.'
      ## -- Mobility and transport ---------------------------------------------
      ## At the 300 m of the city's walkability policy, as the other walking
